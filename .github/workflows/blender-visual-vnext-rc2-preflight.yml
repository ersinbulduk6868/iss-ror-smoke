name: ISS Blender visual vNext RC2 Bugatti duel preflight

on:
  workflow_dispatch:
  push:
    branches:
      - 'iss-test/visual-vnext-rc2-fullsource-preflight'
    paths:
      - '.github/workflows/blender-visual-vnext-rc2-preflight.yml'
      - 'tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py'
      - 'tools/visual_v4_asset_preflight.py'
      - 'blender/visual_v4_scene.py'
      - 'blender/visual_vnext_rc2_bugatti_duel.py'
      - 'blender/visual_vnext_rc2_bugatti_duel_impl.py'
      - 'blender/visual_vnext_rc2_bugatti_duel_diagnostic.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: iss-visual-vnext-rc2-bugatti-duel-preflight
  cancel-in-progress: true

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_URL: 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz'
  ASSET_ACCESS_URL: 'https://hnszvqlgqatsgbuchewt.supabase.co/functions/v1/iss-final-video-transfer-once'
  SUPABASE_ANON_JWT: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhuc3p2cWxncWF0c2didWNoZXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDM0NjYsImV4cCI6MjEwMTY3OTQ2Nn0.anxhWIG2ufyD1DpHJUDz4LvLoRghHW4fDiN-vTj_auc'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Static diagnostic audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual-vnext-rc2-preflight
          python3 -m py_compile tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py tools/visual_v4_asset_preflight.py blender/visual_v4_scene.py blender/visual_vnext_rc2_bugatti_duel.py blender/visual_vnext_rc2_bugatti_duel_impl.py blender/visual_vnext_rc2_bugatti_duel_diagnostic.py
          ! grep -R -F '_quant120.json' blender/visual_vnext_rc2_bugatti_duel*.py tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py
          ! grep -R -F 'BLENDER_WORKBENCH' blender/visual_vnext_rc2_bugatti_duel*.py
          grep -F 'BLENDER_EEVEE_NEXT' blender/visual_v4_scene.py >/dev/null
          echo 'DIAGNOSTIC_STATIC_AUDIT=PASS' | tee artifacts/visual-vnext-rc2-preflight/static-audit.log

      - name: Resolve exact Bugatti private read
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iss-visual-vnext-rc2-assets" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error -H "apikey: $SUPABASE_ANON_JWT" -H "Authorization: Bearer $SUPABASE_ANON_JWT" -H "x-github-oidc: $OIDC" -H 'Content-Type: application/json' --data '{"mode":"resolve_bugatti_pair"}' "$ASSET_ACCESS_URL" > artifacts/visual-vnext-rc2-preflight/asset-access.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json',encoding='utf-8'))
          assert d.get('success') is True and d.get('status')=='BUGATTI_PAIR_ACCESS_READY',d
          a=d['asset']
          assert a['expectedSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('BUGATTI_SOURCE_URL='+a['signedUrl']+'\n')
          print('BUGATTI_PAIR_ACCESS_CONTRACT=PASS')
          PY

      - name: Validate exact full-source Bugatti
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py 2>&1 | tee artifacts/visual-vnext-rc2-preflight/asset-preflight.log
          grep -F 'BUGATTI_DUEL_EXACT_SHA=PASS' artifacts/visual-vnext-rc2-preflight/asset-preflight.log
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/assets.json',encoding='utf-8'))
          a=d['assets']['bugattiA']; b=d['assets']['bugattiB']
          assert d['status']=='PASS' and d['quant120Forbidden'] is True
          assert a['identity']['primarySceneSha256']==b['identity']['primarySceneSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          print('BUGATTI_A_PRIMARY='+a['primaryScene'])
          print('BUGATTI_B_PRIMARY='+b['primaryScene'])
          PY

      - name: Install Blender dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          curl --fail --location --retry 3 --retry-all-errors "$BLENDER_URL" -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BIN=".blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BIN" --version | tee artifacts/visual-vnext-rc2-preflight/blender-version.txt
          grep -F "Blender ${BLENDER_VERSION}" artifacts/visual-vnext-rc2-preflight/blender-version.txt

      - name: Run trajectory diagnostic with unchanged collision gates
        shell: bash
        run: |
          set -o pipefail
          BIN=".blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          set +e
          "$BIN" --background --factory-startup --python blender/visual_vnext_rc2_bugatti_duel_diagnostic.py -- --mode preflight --bugatti-a "$BUGATTI_A_PRIMARY" --bugatti-b "$BUGATTI_B_PRIMARY" --asset-manifest artifacts/visual-vnext-rc2-preflight/assets.json --out artifacts/visual-vnext-rc2-preflight 2>&1 | tee artifacts/visual-vnext-rc2-preflight/blender-preflight.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -F 'BUGATTI_DUEL_TRAJECTORY_DIAGNOSTIC=' artifacts/visual-vnext-rc2-preflight/blender-preflight.log
          if [ "$rc" -eq 0 ]; then
            grep -F 'ISS_VISUAL_VNEXT_RC2_BUGATTI_DUEL_MACHINE_PREFLIGHT=PASS' artifacts/visual-vnext-rc2-preflight/blender-preflight.log
          else
            grep -F 'HEAD_ON_IMPACT_NOT_OBSERVED_WITH_TRAJECTORY_DIAGNOSTIC' artifacts/visual-vnext-rc2-preflight/blender-preflight.log
            exit "$rc"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-visual-vnext-rc2-bugatti-duel-diagnostic-${{ github.run_id }}
          path: artifacts/visual-vnext-rc2-preflight/
          if-no-files-found: warn
          retention-days: 7
