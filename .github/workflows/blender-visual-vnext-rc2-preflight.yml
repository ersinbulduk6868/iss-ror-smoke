name: ISS Blender visual vNext RC2 full-source preflight

on:
  workflow_dispatch:
  push:
    branches:
      - 'iss-test/visual-vnext-rc2-fullsource-preflight'
    paths:
      - '.github/workflows/blender-visual-vnext-rc2-preflight.yml'
      - 'tools/visual_vnext_rc2_static_audit.py'
      - 'tools/visual_vnext_rc2_asset_preflight.py'
      - 'tools/visual_v4_asset_preflight.py'
      - 'blender/visual_v4_scene.py'
      - 'ISS_BATTLE_VIDEO_VISUAL_ACCEPTANCE_VNEXT_RC2.md'

permissions:
  contents: read
  id-token: write

concurrency:
  group: iss-visual-vnext-rc2-preflight
  cancel-in-progress: true

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_URL: 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz'
  ASSET_ACCESS_URL: 'https://hnszvqlgqatsgbuchewt.supabase.co/functions/v1/iss-final-video-transfer-once'
  SUPABASE_ANON_JWT: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhuc3p2cWxncWF0c2didWNoZXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDM0NjYsImV4cCI6MjEwMTY3OTQ2Nn0.anxhWIG2ufyD1DpHJUDz4LvLoRghHW4fDiN-vTj_auc'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Static candidate audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual-vnext-rc2-preflight
          python3 -m py_compile tools/visual_vnext_rc2_static_audit.py tools/visual_vnext_rc2_asset_preflight.py tools/visual_v4_asset_preflight.py blender/visual_v4_scene.py
          python3 tools/visual_vnext_rc2_static_audit.py 2>&1 | tee artifacts/visual-vnext-rc2-preflight/static-audit.log
          grep -F 'STATIC_CANDIDATE_AUDIT=PASS' artifacts/visual-vnext-rc2-preflight/static-audit.log

      - name: Resolve approved full-source asset reads
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iss-visual-vnext-rc2-assets" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_JWT" \
            -H "Authorization: Bearer $SUPABASE_ANON_JWT" \
            -H "x-github-oidc: $OIDC" \
            -H 'Content-Type: application/json' \
            --data '{"mode":"resolve_assets"}' \
            "$ASSET_ACCESS_URL" > artifacts/visual-vnext-rc2-preflight/asset-access.json
          python3 - <<'PY'
          import json, os
          p='artifacts/visual-vnext-rc2-preflight/asset-access.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('success') is True, d
          assert d.get('service')=='iss-final-video-transfer-once', d
          assert d.get('version')=='3.0.0-visual-vnext-rc2-asset-access', d
          assert d.get('status')=='ASSET_ACCESS_READY', d
          a=d['assets']['bugatti']; z=d['assets']['bulldozer']
          assert a['uid']=='4af92c51ecdd4efa9b1c19a1163d9f46'
          assert a['expectedSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          assert int(a['expectedBytes'])==31576440
          assert z['uid']=='b06a715d23a7450babac383b8bb7fb0a'
          assert z['expectedSha256']=='2c0be359bbc6c99118751e7caa4b71a205961914e78d2e58c5dd7afc0f498468'
          assert z['library']['status']=='PRODUCTION_READY'
          assert z['library']['assetProfile']=='DYNAMIC_ACTOR'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUGATTI_SOURCE_URL='+a['signedUrl']+'\n')
              f.write('BULLDOZER_SOURCE_URL='+z['signedUrl']+'\n')
          print('ASSET_ACCESS_CONTRACT=PASS')
          print('BULLDOZER_LIBRARY_IDENTITY=PASS')
          PY

      - name: Acquire and validate exact full source geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_vnext_rc2_asset_preflight.py 2>&1 | tee artifacts/visual-vnext-rc2-preflight/asset-preflight.log
          grep -F 'ASSET_PREFLIGHT=PASS' artifacts/visual-vnext-rc2-preflight/asset-preflight.log
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/assets.json',encoding='utf-8'))
          assert d['status']=='PASS'
          assert d['visualProxyForbidden'] is True
          assert d['quant120Forbidden'] is True
          b=d['assets']['bugatti']; z=d['assets']['bulldozer']
          assert b['sourceIdentity']['uid']=='4af92c51ecdd4efa9b1c19a1163d9f46'
          assert z['sourceIdentity']['uid']=='b06a715d23a7450babac383b8bb7fb0a'
          assert b['fullGeometryGate'] is True and z['fullGeometryGate'] is True
          assert b['identity']['binaryExact'] is True
          assert z['identity']['binaryExact'] is True
          assert z['geometry']['meshCount']==441
          assert z['geometry']['materialCount']==14
          assert z['geometry']['imageCount']==44
          assert z['geometry']['nodeCount']==904
          assert z['geometry']['triangleCount']==111483
          print('BUGATTI_PRIMARY='+b['primaryScene'])
          print('BULLDOZER_PRIMARY='+z['primaryScene'])
          PY

      - name: Install Blender runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils ffmpeg libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          curl --fail --location --retry 3 --retry-all-errors "$BLENDER_URL" -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BIN=".blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BIN" --version | tee artifacts/visual-vnext-rc2-preflight/blender-version.txt
          grep -F "Blender ${BLENDER_VERSION}" artifacts/visual-vnext-rc2-preflight/blender-version.txt

      - name: Run full-source physics camera lighting damage debris preflight
        shell: bash
        run: |
          set -euo pipefail
          BIN=".blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BIN" --background --factory-startup --python blender/visual_v4_scene.py -- \
            --mode preflight \
            --bugatti "$BUGATTI_PRIMARY" \
            --bulldozer "$BULLDOZER_PRIMARY" \
            --asset-manifest artifacts/visual-vnext-rc2-preflight/assets.json \
            --out artifacts/visual-vnext-rc2-preflight \
            2>&1 | tee artifacts/visual-vnext-rc2-preflight/blender-preflight.log
          grep -F 'ISS_VISUAL_V4_MACHINE_PREFLIGHT=PASS' artifacts/visual-vnext-rc2-preflight/blender-preflight.log

      - name: Validate machine preflight truth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/visual-vnext-rc2-preflight/validation.log
          import json
          from pathlib import Path
          p=Path('artifacts/visual-vnext-rc2-preflight/preflight-result.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          failures=[]
          if d.get('status')!='MACHINE_PREFLIGHT_PASS_VISUAL_REVIEW_REQUIRED': failures.append('status')
          if d.get('renderEngine')!='BLENDER_EEVEE_NEXT': failures.append('renderEngine')
          if d.get('visualGeometry')!='FULL_SOURCE_GLTF': failures.append('visualGeometry')
          if d.get('visualProxyUsed') is not False: failures.append('visualProxyUsed')
          if d.get('collisionProxyUsed') is not True: failures.append('collisionProxyUsed')
          if d.get('vehicleMotionSolverDriven') is not True: failures.append('vehicleMotionSolverDriven')
          if d.get('postHandoffVehicleLocationKeys') is not False: failures.append('postHandoffVehicleLocationKeys')
          if d.get('damagePhysicalSolver') is not False: failures.append('damagePhysicalSolverTruth')
          if d.get('debrisRigidBody') is not True: failures.append('debrisRigidBody')
          if d.get('debrisReleaseImpactTriggered') is not True: failures.append('debrisReleaseImpactTriggered')
          if d.get('cameraShotCount',0)<3: failures.append('cameraShotCount')
          if d.get('resolution')!=[960,540]: failures.append('resolution')
          gates=d.get('machineGates') or {}
          failures.extend(k for k,v in gates.items() if v is not True)
          previews=d.get('previews') or []
          if len(previews)!=3: failures.append('previewCount')
          for row in previews:
              q=Path(row['path'])
              if not q.is_file() or q.stat().st_size < 20000: failures.append('previewInvalid:'+str(q))
          if not d.get('visualReviewRequired'): failures.append('visualReviewRequired')
          if failures: raise SystemExit('MACHINE_PREFLIGHT_VALIDATION_FAIL|'+','.join(failures))
          print('MACHINE_PREFLIGHT_TRUTH_CONTRACT=PASS')
          print('FINAL_RENDER_AUTHORIZATION=NOT_YET_VISUAL_REVIEW_REQUIRED')
          PY

      - name: Build three-frame visual review strip
        shell: bash
        run: |
          set -euo pipefail
          A="$(find artifacts/visual-vnext-rc2-preflight -maxdepth 1 -name 'preview-approach-*.png' -print -quit)"
          I="$(find artifacts/visual-vnext-rc2-preflight -maxdepth 1 -name 'preview-impact-*.png' -print -quit)"
          F="$(find artifacts/visual-vnext-rc2-preflight -maxdepth 1 -name 'preview-aftermath-*.png' -print -quit)"
          test -n "$A" && test -n "$I" && test -n "$F"
          ffmpeg -y -i "$A" -i "$I" -i "$F" -filter_complex '[0:v][1:v][2:v]hstack=inputs=3[v]' -map '[v]' -frames:v 1 artifacts/visual-vnext-rc2-preflight/review-strip.jpg
          sha256sum artifacts/visual-vnext-rc2-preflight/review-strip.jpg artifacts/visual-vnext-rc2-preflight/preflight-result.json | tee artifacts/visual-vnext-rc2-preflight/review-sha256.txt

      - name: Upload preflight evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-visual-vnext-rc2-preflight-${{ github.run_id }}
          path: artifacts/visual-vnext-rc2-preflight/
          if-no-files-found: warn
          retention-days: 7
