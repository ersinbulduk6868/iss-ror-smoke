name: ISS Generic Battle Runtime v1 Candidate 3.5.1 damage localization diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - iss-engineering/generic-battle-runtime-v1
    paths:
      - '.github/workflows/generic-battle-runtime-v1-candidate351-damage-diagnostic.yml'
      - 'blender/run_generic_battle_runtime_v1_candidate351_damage_diagnostic.py'

concurrency:
  group: iss-generic-battle-runtime-v1-candidate351-damage-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Candidate 3.5.1 damage localization diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BLENDER_VERSION: '4.5.13'
      EXPECTED_ASSET_SHA: '0b2710a840d128aee53161277edb8cb77e1930d339f53585c6faece3f1dc2b1c'
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Static diagnostic audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/run_generic_battle_runtime_v1_candidate351_damage_diagnostic.py \
            blender/run_generic_battle_runtime_v1_candidate35.py \
            blender/run_generic_battle_runtime_v1_candidate34.py \
            blender/iss_battle_runtime_consequences.py
          grep -q 'DAMAGE_LOCALIZATION_COORDINATE_DIAGNOSTIC' blender/run_generic_battle_runtime_v1_candidate351_damage_diagnostic.py
          ! grep -Eq 'MIN_DAMAGE_SEVERITY\s*=|SEMANTIC.*TOLERANCE|tolerance.*=' blender/run_generic_battle_runtime_v1_candidate351_damage_diagnostic.py
          echo 'CANDIDATE351_DAMAGE_DIAGNOSTIC_STATIC=PASS'

      - name: Build exact generic fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum assets/generated/generic-hypercar-v1/generic_hypercar.glb | awk '{print $1}')" = "$EXPECTED_ASSET_SHA"
          python3 tools/build_generic_battle_runtime_v1_preflight.py

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          curl --fail --location --retry 3 --retry-all-errors \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BLENDER_BIN="$GITHUB_WORKSPACE/.blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER_BIN" --version | grep -q "Blender ${BLENDER_VERSION}"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Run expected-failure geometry diagnostic
        shell: bash
        run: |
          set -uo pipefail
          "$BLENDER_BIN" \
            --background \
            --factory-startup \
            --python blender/run_generic_battle_runtime_v1_candidate351_damage_diagnostic.py \
            -- \
            --request artifacts/generic-battle-runtime-v1-preflight/request.json \
            --asset-map artifacts/generic-battle-runtime-v1-preflight/asset-map.json \
            --output-dir artifacts/generic-battle-runtime-v1-preflight \
            2>&1 | tee candidate351-diagnostic.log
          status=${PIPESTATUS[0]}
          test "$status" -ne 0
          grep -q 'DAMAGE_LOCALIZATION_COORDINATE_DIAGNOSTIC' candidate351-diagnostic.log
          grep -q 'DAMAGE_NO_SOURCE_VERTICES_WITHIN_IMPACT_RADIUS' candidate351-diagnostic.log
          echo 'CANDIDATE351_DAMAGE_LOCALIZATION_DIAGNOSTIC=PASS'

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-generic-battle-runtime-v1-candidate351-diagnostic-${{ github.run_id }}
          path: |
            candidate351-diagnostic.log
            artifacts/generic-battle-runtime-v1-preflight/
          if-no-files-found: warn
          retention-days: 7
