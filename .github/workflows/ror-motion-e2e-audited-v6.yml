name: RoR motion E2E audited v6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ror-motion-e2e-audited-v6.yml'
      - '.github/ror-v6/**'

permissions:
  contents: read

env:
  ROR_SOURCE_TAG_SHA: 'aab166cafd9f5612941c1fbd39e4c64de3cbc7d9'
  ROR_ZIP_URL: 'https://downloads.sourceforge.net/project/rigs-of-rods/Releases/2022.12/RoR-2022.12-linux.zip'
  ROR_ZIP_SHA256: '8e3d79d9f778607954e980950a737a0ca45f9a2e7e391a4c4150da732fd33de1'
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: '1'
  ALSOFT_DRIVERS: 'null'
  CAPTURE_SECONDS: '20'
  CAPTURE_FPS: '30'
  MIN_HORIZONTAL_DISPLACEMENT_M: '2.0'
  SCENE_START_TIMEOUT_SECONDS: '180'
  PROBE_ACK_POLLS: '150'
  RUNTIME_READINESS_SAMPLES: '3'
  PROBE_SCRIPT_NAME: 'iss_motion_probe_v6.as'

jobs:
  motion-e2e:
    name: Audited real RoR vehicle motion and video E2E v6
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install and preflight runner
        shell: bash
        run: bash .github/ror-v6/01-install-preflight.sh

      - name: Download and verify exact official RoR package
        shell: bash
        run: bash .github/ror-v6/02-download-verify-package.sh

      - name: Launch scene and prove real vehicle motion
        shell: bash
        run: bash .github/ror-v6/03-launch-motion.sh

      - name: Validate motion video and final acceptance
        shell: bash
        run: bash .github/ror-v6/04-validate-video.sh

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: bash .github/ror-v6/05-collect-diagnostics.sh

      - name: Upload motion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ror-motion-e2e-audited-v6-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
