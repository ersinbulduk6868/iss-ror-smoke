name: ISS Generic Autonomous Battle Candidate 4.6.4 Cross-Gate Acceptance

# C464 harness full-audited after two pre-runtime harness failures; this run is the single real acceptance.
on:
  push:
    branches: [iss-engineering/generic-battle-runtime-v1]
    paths:
      - '.github/workflows/generic-autonomous-battle-c464-run.yml'

concurrency:
  group: iss-generic-autonomous-battle-c464-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BLENDER_VERSION: '4.5.13'
  EXPECTED_BUGATTI_SHA: '8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
  ASSET_ACCESS_CONTRACT: 'iss-bugatti-pair-access-v1'
  ASSET_ACCESS_URL: 'https://hnszvqlgqatsgbuchewt.supabase.co/functions/v1/iss-final-video-transfer-once'
  SUPABASE_ANON_JWT_FROM_VAR: ${{ vars.SUPABASE_ANON_JWT }}

jobs:
  c464:
    name: Candidate 4.6.4 clean audited generic autonomous battle mechanism
    runs-on: ubuntu-22.04
    timeout-minutes: 48
    steps:
      - name: Checkout candidate 4.6.4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Master Plan preflight and solver-handoff affected-layer audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/iss_battle_runtime_handoff_v1.py \
            blender/iss_battle_runtime_tactics_v5.py \
            blender/iss_battle_runtime_generic_battle_v6.py \
            blender/iss_battle_runtime_consequences_v2.py \
            blender/iss_battle_runtime_consequences_v3.py \
            blender/run_generic_battle_runtime_v1_candidate464_generic_battle.py \
            tools/validate_generic_autonomous_battle_c464.py \
            tools/validate_generic_autonomous_battle_c464_result.py
          python3 tools/validate_generic_autonomous_battle_c464.py | tee c464-property.log
          grep -q '"marker": "GENERIC_AUTONOMOUS_BATTLE_C464_PROPERTY_ACCEPTANCE"' c464-property.log
          grep -q '"status": "PASS"' c464-property.log
          grep -q '"affectedLayerAudit": "PASS"' c464-property.log
          grep -q '"solverHandoffLatchPolicy": "PASS"' c464-property.log
          grep -q '"solverHandoffLatchedUntilVerifiedContactOrPhysicalMiss": true' c464-property.log
          grep -q '"solverHandoffReleaseUsesLiveSeparation": true' c464-property.log
          grep -q '"g05ControllerAuthorityContractPreserved": true' c464-property.log
          grep -q '"precontactRunwayRequired": true' c464-property.log
          grep -q '"surfaceGapRevalidatedDuringReposition": true' c464-property.log
          grep -q '"damageThresholdAwareControl": false' c464-property.log
          grep -q '"targetToughnessAwareControl": false' c464-property.log
          grep -q '"fixtureMutationForAcceptance": false' c464-property.log
          grep -q '"damageAdmissionThresholdChanged": false' c464-property.log
          grep -q '"contactThresholdChanged": false' c464-property.log

          test "$(git hash-object blender/iss_battle_runtime_handoff_v1.py)" = 'ce7dbc0cc273691e1d891dcb5255d187976a0aa2'
          test "$(git hash-object blender/iss_battle_runtime_tactics_v5.py)" = 'fd6bb762b65301da9a8f138f05e22e0a76599fd3'
          test "$(git hash-object blender/iss_battle_runtime_generic_battle_v6.py)" = '58c4aba611bef27273ce00f61405e23538b1a861'
          test "$(git hash-object blender/iss_battle_runtime_generic_battle_v2.py)" = 'f7de3d7413e701d9b065c70dc5882ad05c91a1df'
          test "$(git hash-object blender/iss_battle_runtime_consequences_v2.py)" = 'e011a10fee24802c13a1be22d66efe76c406c2c0'
          test "$(git hash-object blender/iss_battle_runtime_consequences_v3.py)" = 'b13a06eb50884299e5a3d083897e1a70d75aad34'
          test "$(git hash-object blender/run_generic_battle_runtime_v1_candidate464_generic_battle.py)" = '0f31a2ac1d52c278e76c097998913344d8abee8a'
          test "$(git hash-object tools/validate_generic_autonomous_battle_c464.py)" = 'c0cf0c164c2781673f2cbf50351b814486bd1fd6'
          test "$(git hash-object tools/validate_generic_autonomous_battle_c464_result.py)" = '295d5a45206f062bc8f63dd580a31a912e461ee0'

          test "$(git hash-object blender/iss_battle_runtime_contract.py)" = '17860a4945d41316793e2a807585d8486a8e65ef'
          test "$(git hash-object blender/iss_battle_runtime_autonomy.py)" = 'd349c51b289266740df7615d37dc645839001641'
          test "$(git hash-object blender/iss_battle_runtime_contact_truth.py)" = '9041178dd7d1a3951912e49ee398e8fa423da730'
          test "$(git hash-object blender/iss_battle_runtime_consequences.py)" = 'ff239d56b823e31046db9ad300932f82262cbb39'
          test "$(git hash-object blender/iss_blender_battle_runtime_v1_hardened.py)" = 'a9694d22697e1de077415f1198d88df5fa07d00a'
          test "$(git hash-object blender/run_generic_battle_runtime_v1_candidate42.py)" = 'a6e8f624f1897f965b7fa1c87ea74afab3eaeeff'
          test "$(git hash-object blender/run_generic_battle_runtime_v1_candidate446.py)" = '0a09826e539b51aebf720e3d39b7a1ba9aee733b'
          echo 'C464_MASTER_PLAN_PREFLIGHT_AND_SOLVER_HANDOFF_AUDIT=PASS'

      - name: Resolve and acquire exact Bugatti
        shell: bash
        run: |
          set -euo pipefail
          ANON="$SUPABASE_ANON_JWT_FROM_VAR"
          if [ -z "$ANON" ]; then
            ANON="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('.github/workflows/generic-battle-runtime-v1-candidate42-g05.yml').read_text(encoding='utf-8')
          m=re.search(r"SUPABASE_ANON_JWT:\s*'([^']+)'", text)
          if not m: raise SystemExit('PROVEN_G05_ANON_BOOTSTRAP_NOT_FOUND')
          print(m.group(1))
          PY
            )"
          fi
          echo "::add-mask::$ANON"
          mkdir -p artifacts/visual-vnext-rc2-preflight
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iss-visual-vnext-rc2-assets" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "x-github-oidc: $OIDC" \
            -H 'Content-Type: application/json' --data '{"mode":"resolve_bugatti_pair"}' \
            "$ASSET_ACCESS_URL" > artifacts/visual-vnext-rc2-preflight/asset-access.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json'))
          assert d.get('success') is True and d.get('status')=='BUGATTI_PAIR_ACCESS_READY', d
          assert d.get('contractVersion')==os.environ['ASSET_ACCESS_CONTRACT'], d
          assert d.get('version')=='3.3.23-generic-autonomous-battle-c464-access', d
          a=d['asset']; assert a['expectedSha256']==os.environ['EXPECTED_BUGATTI_SHA'] and int(a['expectedBytes'])==31576440
          assert isinstance(a.get('signedUrl'),str) and a['signedUrl'].startswith('https://')
          PY
          BUGATTI_SOURCE_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json'))['asset']['signedUrl'])
          PY
          )"
          echo "::add-mask::$BUGATTI_SOURCE_URL"
          echo "BUGATTI_SOURCE_URL=$BUGATTI_SOURCE_URL" >> "$GITHUB_ENV"
          export BUGATTI_SOURCE_URL
          python3 tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py 2>&1 | tee c464-asset.log
          grep -q 'BUGATTI_DUEL_EXACT_SHA=PASS' c464-asset.log
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/assets.json'))
          a=d['assets']['bugattiA']; b=d['assets']['bugattiB']
          assert a['identity']['primarySceneSha256']==b['identity']['primarySceneSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          print('BUGATTI_PRIMARY='+a['primaryScene'])
          PY
          echo 'C464_EXACT_BUGATTI_ACCESS=PASS'

      - name: Build unchanged intent-only continuous battle fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_generic_battle_runtime_v1_candidate446_g07.py --bugatti-primary "$BUGATTI_PRIMARY" | tee c464-fixtures.log
          grep -q 'GENERIC_BATTLE_RUNTIME_CANDIDATE446_G07_FIXTURES_PASS' c464-fixtures.log
          SRC=artifacts/generic-battle-runtime-v1-candidate446-g07
          DST=artifacts/generic-autonomous-battle-c464
          mkdir -p "$DST/exact-bugatti" "$DST/generic-hypercar"
          for NAME in exact-bugatti generic-hypercar; do
            cp "$SRC/$NAME/request.json" "$DST/$NAME/request.json"
            cp "$SRC/$NAME/asset-map.json" "$DST/$NAME/asset-map.json"
            test "$(sha256sum "$SRC/$NAME/request.json" | awk '{print $1}')" = "$(sha256sum "$DST/$NAME/request.json" | awk '{print $1}')"
            test "$(sha256sum "$SRC/$NAME/asset-map.json" | awk '{print $1}')" = "$(sha256sum "$DST/$NAME/asset-map.json" | awk '{print $1}')"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/generic-autonomous-battle-c464")
          report={}
          forbidden=(
              "collisionframe","contactframe","impactframe","targetenergyj","impactenergyj",
              "targetimpactspeedmps","trajectorypoints","pathpoints","waypoints",
              "positionkeyframes","velocitykeyframes","steeringangle","brakingpoint",
              "approachvector","collisionpoint","contactpoint","forcedwinner","winnerid",
          )
          for name in ("exact-bugatti","generic-hypercar"):
              path=root/name/"request.json"
              data=json.loads(path.read_text(encoding="utf-8"))
              events={str(e.get("eventId")):e for e in data["battlePlan"]["events"]}
              physical=[]
              for event_id in ("evt-escalation","evt-counterattack"):
                  event=events[event_id]
                  target=str(event.get("attackTarget") or "")
                  assert target and ":" not in target, (name,event_id,target)
                  req=event.get("physicsRequirements") or {}
                  assert set(req)=={"minQualifiedContacts","minDistinctAttackers"}, (name,event_id,req)
                  damage=event.get("damage") or {}
                  assert not bool(damage.get("required")), (name,event_id,"STORY_DAMAGE_REQUIREMENT_FORBIDDEN")
                  assert not str(damage.get("zone") or "").strip(), (name,event_id,"STORY_DAMAGE_ZONE_FORBIDDEN")
                  assert not str(req.get("targetArea") or "").strip(), (name,event_id,"STORY_TARGET_AREA_FORBIDDEN")
                  physical.append(event_id)
              raw=json.dumps(data,sort_keys=True).lower()
              for token in forbidden:
                  assert token not in raw, (name,"FORBIDDEN_STORY_CHOREOGRAPHY",token)
              report[name]=physical
          out={
              "contract":"ISS_C464_UNCHANGED_INTENT_FIXTURE_FIREWALL_V1",
              "fixtureMutationForAcceptance":False,
              "storyDamageRequirementIntroduced":False,
              "storyTargetZoneIntroduced":False,
              "exactImpactEnergyTarget":False,
              "exactImpactSpeedTarget":False,
              "collisionPointTarget":False,
              "perAssetTuning":False,
              "physicalEvents":report,
          }
          (root/"c464-intent-firewall.json").write_text(json.dumps(out,indent=2,sort_keys=True),encoding="utf-8")
          print(json.dumps(out,sort_keys=True))
          PY
          echo 'C464_UNCHANGED_INTENT_ONLY_FIXTURES=PASS'

      - name: Install exact Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xz-utils unzip libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 >/dev/null
          mkdir -p .blender
          curl --fail --location --retry 3 --retry-all-errors \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BLENDER_BIN="$GITHUB_WORKSPACE/.blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER_BIN" --version | tee c464-blender-version.log
          grep -q "Blender ${BLENDER_VERSION}" c464-blender-version.log
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Run exact Bugatti C464 battle
        timeout-minutes: 14
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          D=artifacts/generic-autonomous-battle-c464/exact-bugatti
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python blender/run_generic_battle_runtime_v1_candidate464_generic_battle.py -- \
            --request "$D/request.json" --asset-map "$D/asset-map.json" --output-dir "$D" \
            2>&1 | tee c464-bugatti-runtime.log
          grep -q 'GENERIC_AUTONOMOUS_BATTLE_C464_ENGINEERING_READY' c464-bugatti-runtime.log
          grep -q 'PAIRWISE_NATIVE_SOLVER_CONTACT_VERIFIED' c464-bugatti-runtime.log
          grep -q 'CAUSAL_VISIBLE_IMPACT_CONSEQUENCE_V3_APPLIED' c464-bugatti-runtime.log
          grep -q 'GENERIC_AUTONOMOUS_BATTLE_V6_EVIDENCE_WRITTEN' c464-bugatti-runtime.log
          grep -q 'G07_CAUSAL_CLIMAX_STATE_REALIZED' c464-bugatti-runtime.log
          grep -q 'G08_CINEMATIC_SALIENCE_EVIDENCE_WRITTEN' c464-bugatti-runtime.log
          grep -q '"success": true' c464-bugatti-runtime.log

      - name: Run generic hypercar C464 battle
        timeout-minutes: 14
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          D=artifacts/generic-autonomous-battle-c464/generic-hypercar
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python blender/run_generic_battle_runtime_v1_candidate464_generic_battle.py -- \
            --request "$D/request.json" --asset-map "$D/asset-map.json" --output-dir "$D" \
            2>&1 | tee c464-generic-runtime.log
          grep -q 'GENERIC_AUTONOMOUS_BATTLE_C464_ENGINEERING_READY' c464-generic-runtime.log
          grep -q 'PAIRWISE_NATIVE_SOLVER_CONTACT_VERIFIED' c464-generic-runtime.log
          grep -q 'CAUSAL_VISIBLE_IMPACT_CONSEQUENCE_V3_APPLIED' c464-generic-runtime.log
          grep -q 'GENERIC_AUTONOMOUS_BATTLE_V6_EVIDENCE_WRITTEN' c464-generic-runtime.log
          grep -q 'G07_CAUSAL_CLIMAX_STATE_REALIZED' c464-generic-runtime.log
          grep -q 'G08_CINEMATIC_SALIENCE_EVIDENCE_WRITTEN' c464-generic-runtime.log
          grep -q '"success": true' c464-generic-runtime.log

      - name: Strict C464 cross-gate machine acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT=artifacts/generic-autonomous-battle-c464
          python3 tools/validate_generic_autonomous_battle_c464_result.py \
            --bugatti-battle "$ROOT/exact-bugatti/generic-autonomous-battle-v6-evidence.json" \
            --bugatti-g06 "$ROOT/exact-bugatti/g06-persistence-evidence.json" \
            --bugatti-g07 "$ROOT/exact-bugatti/g07-causal-drama-evidence.json" \
            --bugatti-g08 "$ROOT/exact-bugatti/g08-camera-evidence.json" \
            --generic-battle "$ROOT/generic-hypercar/generic-autonomous-battle-v6-evidence.json" \
            --generic-g06 "$ROOT/generic-hypercar/g06-persistence-evidence.json" \
            --generic-g07 "$ROOT/generic-hypercar/g07-causal-drama-evidence.json" \
            --generic-g08 "$ROOT/generic-hypercar/g08-camera-evidence.json" | tee c464-machine.log
          grep -q '"marker": "GENERIC_AUTONOMOUS_BATTLE_C464_MACHINE_ACCEPTANCE"' c464-machine.log
          grep -q '"status": "PASS"' c464-machine.log
          grep -q '"precontactRunway": "PASS"' c464-machine.log
          grep -q '"surfaceGapRevalidation": "PASS"' c464-machine.log
          grep -q '"standOffLiveSupportGeometry": "PASS"' c464-machine.log
          grep -q '"solverHandoffLatch": "PASS"' c464-machine.log
          grep -q '"g05ControllerAuthorityContractPreserved": true' c464-machine.log
          grep -q '"secondNativeContact": "PASS"' c464-machine.log
          grep -q '"twoSidedDamage": "PASS"' c464-machine.log
          grep -q '"visibleCausalDamageDebris": "PASS"' c464-machine.log
          grep -q '"damageAdmissionThresholdChanged": false' c464-machine.log
          grep -q '"contactThresholdChanged": false' c464-machine.log
          grep -q '"damageThresholdAwareControl": false' c464-machine.log
          grep -q '"targetToughnessAwareControl": false' c464-machine.log
          grep -q '"fixtureMutationForAcceptance": false' c464-machine.log
          grep -q '"humanCinematicAcceptance": "PENDING"' c464-machine.log
          echo 'ISS_GENERIC_AUTONOMOUS_BATTLE_C464_MACHINE_ACCEPTANCE=PASS_HUMAN_REVIEW_PENDING'

      - name: Write C464 acceptance manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('artifacts/generic-autonomous-battle-c464'); root.mkdir(parents=True,exist_ok=True)
          out={
            'candidate':'ISS_GENERIC_BATTLE_RUNTIME_V1_CANDIDATE_4_6_4_GENERIC_AUTONOMOUS_BATTLE',
            'mechanism':'ISS_GENERIC_AUTONOMOUS_BATTLE_MECHANISM_V6',
            'affectedLayerAudit':'SOLVER_HANDOFF_LATCH_AFFECTED_LAYER_AUDIT_20260918',
            'fixtureMutationForAcceptance':False,
            'storyDamageRequirementIntroduced':False,
            'storyTargetZoneIntroduced':False,
            'precontactRunwayRequired':True,
            'solverHandoffLatchedUntilVerifiedContactOrPhysicalMiss':True,
            'g05ControllerAuthorityContractPreserved':True,
            'damageThresholdAwareControl':False,
            'targetToughnessAwareControl':False,
            'desiredImpactSpeedControl':False,
            'desiredImpactEnergyControl':False,
            'damageAdmissionThresholdChanged':False,
            'contactThresholdChanged':False,
            'headSha':os.environ.get('GITHUB_SHA'),
            'propertyAcceptance':'PASS_IF_PREFLIGHT_SUCCEEDED',
            'machineAcceptance':'PASS_IF_MACHINE_STEP_SUCCEEDED',
            'humanCinematicAcceptance':'PENDING_FRESH_REVIEW',
            'scopePostflight':'PENDING_AFTER_MACHINE_AND_HUMAN_REVIEW',
            'g04ToG08FormalClosure':False,
            'productionReadyClaimed':False,
          }
          (root/'c464-acceptance-manifest.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          PY

      - name: Upload Candidate 4.6.4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iss-generic-autonomous-battle-c464-${{ github.run_id }}
          path: |
            c464-*.log
            artifacts/generic-autonomous-battle-c464
            artifacts/visual-vnext-rc2-preflight/asset-access.json
          if-no-files-found: warn
          retention-days: 30
