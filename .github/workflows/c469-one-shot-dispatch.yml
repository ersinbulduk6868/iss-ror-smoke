name: ISS C469 One-Shot Dispatcher

on:
  push:
    branches:
      - iss-engineering/generic-battle-c469-repair
    paths:
      - '.github/workflows/c469-one-shot-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch audited C469 acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generic-autonomous-battle-c469-run.yml/dispatches" \
            -d '{"ref":"iss-engineering/generic-battle-c469-repair"}'
          echo 'C469_DISPATCH_REQUESTED=PASS'
