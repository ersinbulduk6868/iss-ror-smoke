name: RoR motion E2E audited v7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ror-motion-e2e-audited-v7.yml'
      - '.github/ror-v7/**'
      - '.github/ror-v61/**'
      - '.github/ror-v6/**'

permissions:
  contents: read

env:
  ROR_SOURCE_TAG_SHA: 'aab166cafd9f5612941c1fbd39e4c64de3cbc7d9'
  ROR_ZIP_URL: 'https://downloads.sourceforge.net/project/rigs-of-rods/Releases/2022.12/RoR-2022.12-linux.zip'
  ROR_ZIP_SHA256: '8e3d79d9f778607954e980950a737a0ca45f9a2e7e391a4c4150da732fd33de1'
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: '1'
  ALSOFT_DRIVERS: 'null'
  CAPTURE_SECONDS: '90'
  CAPTURE_FPS: '30'
  MIN_HORIZONTAL_DISPLACEMENT_M: '2.0'
  SCENE_START_TIMEOUT_SECONDS: '180'
  PROBE_ACK_POLLS: '600'
  RUNTIME_READINESS_SAMPLES: '3'
  PROBE_SCRIPT_NAME: 'iss_motion_probe_v6.as'

jobs:
  motion-e2e:
    name: Audited RoR motion on source-backed software-render profile v7
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install and preflight runner
        shell: bash
        run: bash .github/ror-v6/01-install-preflight.sh

      - name: Download and verify exact official RoR package
        shell: bash
        run: bash .github/ror-v6/02-download-verify-package.sh

      - name: Apply source-audited software-render profile
        shell: bash
        run: bash .github/ror-v7/03-prepare-software-render-profile.sh

      - name: Launch unchanged V6 acceptance under true-RoR supervisor
        shell: bash
        run: bash .github/ror-v61/03-supervise-v6.sh

      - name: Validate motion video and preserved acceptance
        shell: bash
        run: bash .github/ror-v6/04-validate-video.sh

      - name: Promote preserved gates to V7 acceptance
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'CI_RENDER_PROFILE_GATE=PASS' artifacts/ci-render-profile-gate.txt
          grep -F 'ROR_MOTION_E2E_AUDITED_V6_ACCEPTANCE=PASS' artifacts/acceptance.txt
          ! grep -F 'Cannot open file:' artifacts/logs/RoR-after-motion.log | grep -F '/config/RoR.cfg'
          {
            echo 'ROR_MOTION_E2E_AUDITED_V7_ACCEPTANCE=PASS'
            echo 'PINNED_ROR_PACKAGE_SHA=PASS'
            echo 'CI_RENDER_PROFILE=SOURCE_AUDITED_FASTEST_MODES_PASS'
            echo 'RUNTIME_READINESS=CONSECUTIVE_FRESH_FRAMESTEP_PASS'
            echo 'INPUT_TRANSPORT=ROR_APPLICATION_ACK_PASS'
            echo 'MOTION=PHYSICAL_POSITION_DISPLACEMENT_GE_2M_PASS'
            echo 'VIDEO=REAL_ROR_1280x720_H264_DECODE_PASS'
            echo 'TRUE_ENGINE_PID_DIAGNOSTICS=PASS'
          } | tee artifacts/acceptance-v7.txt

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: bash .github/ror-v6/05-collect-diagnostics.sh

      - name: Upload motion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ror-motion-e2e-audited-v7-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
