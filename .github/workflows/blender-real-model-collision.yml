name: ISS Blender real-model collision outcome

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blender-real-model-collision.yml'
      - 'blender/real_model_collision_test.py'
      - 'blender/run_real_model_collision_wrapper.py'
      - 'assets/test-real-model/**'

permissions:
  contents: read

concurrency:
  group: iss-blender-real-model-collision
  cancel-in-progress: true

env:
  BLENDER_VERSION: '4.5.13'
  BLENDER_URL: 'https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz'

jobs:
  real-model-collision:
    name: Uploaded Bugatti vs bulldozer collision outcome
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils ffmpeg libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender artifacts/real-model
          curl --fail --location --retry 3 --retry-all-errors "$BLENDER_URL" -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BIN=".blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BIN" --version | tee artifacts/real-model/blender-version.txt
          grep -F "Blender ${BLENDER_VERSION}" artifacts/real-model/blender-version.txt
          echo 'BLENDER_HEADLESS_PREFLIGHT=PASS'

      - name: Validate exact-upload-derived geometry evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          checks = [
            ('assets/test-real-model/bugatti_quant120.json', '8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'),
            ('assets/test-real-model/bulldozer_quant120.json', '187f81c3c4638180fb8d82c5b2bbc7510f01bc970ee149713b2de993089f1e18'),
          ]
          for path, expected in checks:
              d=json.load(open(path,encoding='utf-8'))
              assert d['source_sha256']==expected, (path,d.get('source_sha256'))
              assert d['transport']=='exact-upload-derived-quantized-surface-v1'
              assert int(d['kept_triangles'])==120
              assert len(d['qv'])%3==0 and len(d['f'])%3==0
              print(path, 'source_sha256='+expected, 'transport_triangles=120')
          print('UPLOADED_ASSET_GEOMETRY_GATE=PASS')
          PY

      - name: Run six-second collision and aftermath
        shell: bash
        run: |
          set -euo pipefail
          BIN=".blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BIN" --background --factory-startup --python blender/run_real_model_collision_wrapper.py -- \
            --hypercar-quant assets/test-real-model/bugatti_quant120.json \
            --bulldozer-quant assets/test-real-model/bulldozer_quant120.json \
            --output artifacts/real-model/bugatti-vs-bulldozer.mp4 \
            --result artifacts/real-model/result.json \
            2>&1 | tee artifacts/real-model/runtime.log
          grep -F 'ISS_REAL_MODEL_COLLISION_OUTCOME=PASS' artifacts/real-model/runtime.log

      - name: Validate machine evidence and video
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/real-model/result.json',encoding='utf-8'))
          required={
            'scope':'ISS_REAL_MODEL_COLLISION_OUTCOME_TEST',
            'engine':'BLENDER',
            'engineVersion':'4.5.13',
            'physicsBackend':'BLENDER_RIGID_BODY',
            'continuousWorld':True,
            'collisionObserved':True,
            'momentumTransferObserved':True,
            'massAsymmetryPlausible':True,
            'carLostSpeedAfterImpact':True,
            'persistentOutcome':True,
            'scriptedDamageUsed':False,
            'dynamicBeforeImpact':True,
            'postHandoffLocationKeyframeCount':0,
            'geometryTransport':'exact-upload-derived-quantized-surface-v1',
            'carSourceSha256':'8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4',
            'bulldozerSourceSha256':'187f81c3c4638180fb8d82c5b2bbc7510f01bc970ee149713b2de993089f1e18',
          }
          bad=[f'{k}: expected {v!r}, got {d.get(k)!r}' for k,v in required.items() if d.get(k)!=v]
          if abs(float(d.get('bulldozerMassKg',0))-27614.189525707065)>0.01: bad.append('bulldozer mass mismatch')
          if abs(float(d.get('carMassKg',0))-1450.0)>0.01: bad.append('car mass mismatch')
          if float(d.get('simulationSeconds',0)) < 5.9: bad.append('simulation shorter than 6s')
          if bad: raise SystemExit('\n'.join(bad))
          print('ISS_REAL_MODEL_EVIDENCE=PASS')
          print(json.dumps({k:d.get(k) for k in [
            'impactFrame','impactTimeSeconds','preImpactCarMaxSpeedMps','impactCarSpeedMps',
            'impactBulldozerSpeedMps','bulldozerMaxSpeedMps','bulldozerMaxDisplacementMeters',
            'finalBulldozerDisplacementMeters','massRatioBulldozerToCar','carDimensionsMeters',
            'bulldozerDimensionsMeters']},indent=2))
          PY
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 artifacts/real-model/bugatti-vs-bulldozer.mp4)"
          echo "videoDuration=$duration"
          python3 - "$duration" <<'PY'
          import sys
          if float(sys.argv[1]) < 5.9: raise SystemExit('REAL_MODEL_VIDEO_TOO_SHORT')
          PY
          echo 'ISS_REAL_MODEL_VIDEO=PASS'

      - name: Upload collision evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-real-model-collision-outcome-${{ github.run_id }}
          path: artifacts/real-model/
          if-no-files-found: warn
          retention-days: 7
