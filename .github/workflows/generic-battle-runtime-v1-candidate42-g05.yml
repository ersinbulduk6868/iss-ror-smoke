name: ISS Generic Battle Runtime v1 Candidate 4.2 G05 pairwise contact acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - iss-engineering/generic-battle-runtime-v1
    paths:
      - '.github/workflows/generic-battle-runtime-v1-candidate42-g05.yml'
      - 'docs/ISS_G05_NATIVE_CONTACT_AUTHORITY_AUDIT.md'
      - 'blender/iss_battle_runtime_contact_truth.py'
      - 'blender/run_generic_battle_runtime_v1_candidate42.py'
      - 'tools/validate_generic_battle_runtime_v1_candidate42.py'
      - 'tools/validate_generic_battle_runtime_v1_candidate42_result.py'

concurrency:
  group: iss-generic-battle-runtime-v1-candidate42-g05
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BLENDER_VERSION: '4.5.13'
  EXPECTED_BUGATTI_SHA: '8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
  ASSET_ACCESS_URL: 'https://hnszvqlgqatsgbuchewt.supabase.co/functions/v1/iss-final-video-transfer-once'
  SUPABASE_ANON_JWT: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhuc3p2cWxncWF0c2didWNoZXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDM0NjYsImV4cCI6MjEwMTY3OTQ2Nn0.anxhWIG2ufyD1DpHJUDz4LvLoRghHW4fDiN-vTj_auc'

jobs:
  g05:
    name: Candidate 4.2 G05 pairwise native solver response truth
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Candidate 4.2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: G05 property, negative-control, preservation and no-cheating acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/iss_battle_runtime_contact_truth.py \
            blender/run_generic_battle_runtime_v1_candidate42.py \
            tools/validate_generic_battle_runtime_v1_candidate42.py \
            tools/validate_generic_battle_runtime_v1_candidate42_result.py
          python3 tools/validate_generic_battle_runtime_v1_candidate42.py | tee candidate42-g05-property.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_CANDIDATE42_G05_PROPERTY_ACCEPTANCE"' candidate42-g05-property.log
          grep -q '"status": "PASS"' candidate42-g05-property.log
          grep -q '"wrongTargetRejected": {"qualified": false' candidate42-g05-property.log
          grep -q '"controllerAuthorityRejected": {"qualified": false' candidate42-g05-property.log
          grep -q '"nonAdjacentRejected": {"qualified": false' candidate42-g05-property.log
          grep -q '"semanticMismatchRejected": {"qualified": false' candidate42-g05-property.log
          grep -q '"unilateralWallRejected": {"qualified": false' candidate42-g05-property.log
          ! grep -q 'obb_overlap_2d(' blender/run_generic_battle_runtime_v1_candidate42.py
          ! grep -q 'convex_sweep_test(' blender/run_generic_battle_runtime_v1_candidate42.py
          echo 'CANDIDATE42_G05_ZERO_COST_ACCEPTANCE=PASS'

      - name: Resolve fresh exact Bugatti private read
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual-vnext-rc2-preflight
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iss-visual-vnext-rc2-assets" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_JWT" \
            -H "Authorization: Bearer $SUPABASE_ANON_JWT" \
            -H "x-github-oidc: $OIDC" \
            -H 'Content-Type: application/json' \
            --data '{"mode":"resolve_bugatti_pair"}' \
            "$ASSET_ACCESS_URL" > artifacts/visual-vnext-rc2-preflight/asset-access.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json',encoding='utf-8'))
          assert d.get('success') is True and d.get('status')=='BUGATTI_PAIR_ACCESS_READY', d
          a=d['asset']
          assert a['expectedSha256']==os.environ['EXPECTED_BUGATTI_SHA']
          assert int(a['expectedBytes'])==31576440 and int(a['pairCount'])==2
          assert a['transport']=='SUPABASE_PRIVATE_STORAGE_SIGNED_READ'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUGATTI_SOURCE_URL='+a['signedUrl']+'\n')
          print('CANDIDATE42_FRESH_BUGATTI_ACCESS=PASS')
          PY

      - name: Acquire and validate exact full-source Bugatti
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py 2>&1 | tee candidate42-bugatti-asset.log
          grep -q 'BUGATTI_DUEL_EXACT_SHA=PASS' candidate42-bugatti-asset.log
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/assets.json',encoding='utf-8'))
          a=d['assets']['bugattiA']; b=d['assets']['bugattiB']
          assert d['status']=='PASS' and d['visualProxyForbidden'] is True and d['quant120Forbidden'] is True
          assert a['identity']['binaryExact'] is True and b['identity']['binaryExact'] is True
          assert a['identity']['primarySceneSha256']==b['identity']['primarySceneSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          assert a['sourceIdentity']['uid']==b['sourceIdentity']['uid']=='4af92c51ecdd4efa9b1c19a1163d9f46'
          print('BUGATTI_PRIMARY='+a['primaryScene'])
          PY

      - name: Build unchanged G04 acceptance fixtures for G05
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_generic_battle_runtime_v1_candidate40_g04.py --bugatti-primary "$BUGATTI_PRIMARY" | tee candidate42-g05-fixtures.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_CANDIDATE40_G04_FIXTURES_PASS"' candidate42-g05-fixtures.log
          grep -q '"exactCollisionFrameTarget": false' candidate42-g05-fixtures.log
          grep -q '"exactImpactEnergyTarget": false' candidate42-g05-fixtures.log
          echo 'CANDIDATE42_G05_FIXTURES=PASS'

      - name: Install Blender runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xz-utils unzip libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 >/dev/null

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          curl --fail --location --retry 3 --retry-all-errors \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BLENDER_BIN="$GITHUB_WORKSPACE/.blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER_BIN" --version | tee candidate42-blender-version.log
          grep -q "Blender ${BLENDER_VERSION}" candidate42-blender-version.log
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Preserve Candidate 3.9 asset and semantic regression
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python blender/verify_generic_battle_runtime_v1_candidate39_assets.py -- \
            --bugatti "$BUGATTI_PRIMARY" 2>&1 | tee candidate42-preserved-asset-regression.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_CANDIDATE39_ASSET_REGRESSION"' candidate42-preserved-asset-regression.log
          grep -q '"status": "PASS"' candidate42-preserved-asset-regression.log
          echo 'CANDIDATE39_PRESERVED_ASSET_SEMANTIC_REGRESSION=PASS'

      - name: Run Candidate 4.2 exact Bugatti G05 acceptance
        shell: bash
        run: |
          set -euo pipefail
          D=artifacts/generic-battle-runtime-v1-candidate40-g04/exact-bugatti
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python blender/run_generic_battle_runtime_v1_candidate42.py -- \
            --request "$D/request.json" \
            --asset-map "$D/asset-map.json" \
            --output-dir "$D" 2>&1 | tee candidate42-bugatti-runtime.log
          grep -q 'GENERIC_BATTLE_RUNTIME_CANDIDATE42_G05_ENGINEERING_PASS' candidate42-bugatti-runtime.log
          grep -q 'PAIRWISE_NATIVE_SOLVER_CONTACT_VERIFIED' candidate42-bugatti-runtime.log
          grep -q 'G05_PAIRWISE_CONTACT_BOUND_TO_EXISTING_IMPACT_GATE' candidate42-bugatti-runtime.log
          grep -q 'QUALIFIED_NATIVE_RESPONSE_IMPACT' candidate42-bugatti-runtime.log
          grep -q '"success": true' candidate42-bugatti-runtime.log
          echo 'CANDIDATE42_EXACT_BUGATTI_G05_RUNTIME=PASS'

      - name: Run Candidate 4.2 generic-hypercar G05 regression with identical source
        shell: bash
        run: |
          set -euo pipefail
          D=artifacts/generic-battle-runtime-v1-candidate40-g04/generic-hypercar
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 \
            --python blender/run_generic_battle_runtime_v1_candidate42.py -- \
            --request "$D/request.json" \
            --asset-map "$D/asset-map.json" \
            --output-dir "$D" 2>&1 | tee candidate42-generic-runtime.log
          grep -q 'GENERIC_BATTLE_RUNTIME_CANDIDATE42_G05_ENGINEERING_PASS' candidate42-generic-runtime.log
          grep -q 'PAIRWISE_NATIVE_SOLVER_CONTACT_VERIFIED' candidate42-generic-runtime.log
          grep -q 'G05_PAIRWISE_CONTACT_BOUND_TO_EXISTING_IMPACT_GATE' candidate42-generic-runtime.log
          grep -q '"success": true' candidate42-generic-runtime.log
          echo 'CANDIDATE42_GENERIC_HYPERCAR_G05_RUNTIME=PASS'

      - name: Validate G05 machine acceptance without claiming downstream gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_generic_battle_runtime_v1_candidate42_result.py \
            --bugatti-evidence artifacts/generic-battle-runtime-v1-candidate40-g04/exact-bugatti/generic-battle-runtime-v1-evidence.json \
            --generic-evidence artifacts/generic-battle-runtime-v1-candidate40-g04/generic-hypercar/generic-battle-runtime-v1-evidence.json \
            | tee candidate42-g05-machine-acceptance.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_CANDIDATE42_G05_MACHINE_ACCEPTANCE"' candidate42-g05-machine-acceptance.log
          grep -q '"status": "PASS"' candidate42-g05-machine-acceptance.log
          grep -q '"g05NativeContactTruth": true' candidate42-g05-machine-acceptance.log
          grep -q '"g06DamagePersistentStateClaimed": false' candidate42-g05-machine-acceptance.log
          grep -q '"productionReadyClaimed": false' candidate42-g05-machine-acceptance.log
          echo 'ISS_G05_MACHINE_ACCEPTANCE=PASS'

      - name: Upload Candidate 4.2 G05 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-generic-battle-runtime-v1-candidate42-g05-${{ github.run_id }}
          path: |
            candidate42-g05-property.log
            candidate42-bugatti-asset.log
            candidate42-g05-fixtures.log
            candidate42-blender-version.log
            candidate42-preserved-asset-regression.log
            candidate42-bugatti-runtime.log
            candidate42-generic-runtime.log
            candidate42-g05-machine-acceptance.log
            artifacts/generic-battle-runtime-v1-candidate40-g04/
            artifacts/visual-vnext-rc2-preflight/
          if-no-files-found: warn
          retention-days: 14
