name: RoR video smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ror-video-smoke.yml'

permissions:
  contents: read

env:
  ROR_SOURCE_TAG_SHA: 'aab166cafd9f5612941c1fbd39e4c64de3cbc7d9'
  ROR_ZIP_URL: 'https://downloads.sourceforge.net/project/rigs-of-rods/Releases/2022.12/RoR-2022.12-linux.zip'
  ROR_ZIP_SHA256: '8e3d79d9f778607954e980950a737a0ca45f9a2e7e391a4c4150da732fd33de1'
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: '1'
  ALSOFT_DRIVERS: 'null'
  CAPTURE_SECONDS: '20'
  CAPTURE_FPS: '30'
  SCENE_START_TIMEOUT_SECONDS: '180'

jobs:
  render-smoke:
    name: Native Linux RoR fully audited software-render smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Install and preflight runner
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip file python3 procps psmisc coreutils \
            xvfb x11-utils xauth dbus-x11 ffmpeg mesa-utils \
            libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa \
            libx11-6 libxext6 libxrender1 libxi6 libxrandr2 libxinerama1 \
            libxcursor1 libxfixes3 libfontconfig1 libfreetype6 \
            libopenal1 libpulse0 libgtk-3-0

          mkdir -p artifacts/logs
          required=(curl unzip file python3 Xvfb xdpyinfo xwininfo glxinfo glxgears ffmpeg ffprobe ldd sha256sum timeout grep sed awk find sort tee basename stat realpath wc ps)
          for cmd in "${required[@]}"; do command -v "$cmd"; done
          test "$(uname -m)" = 'x86_64'
          ffmpeg -hide_banner -encoders > artifacts/logs/ffmpeg-encoders.txt 2>&1
          grep -E '[[:space:]]libx264[[:space:]]' artifacts/logs/ffmpeg-encoders.txt
          ffmpeg -hide_banner -devices > artifacts/logs/ffmpeg-devices.txt 2>&1
          grep -F 'x11grab' artifacts/logs/ffmpeg-devices.txt
          { uname -a; lsb_release -a 2>&1 || true; ffmpeg -version | sed -n '1p'; } > artifacts/logs/runner-preflight.txt
          printf 'source_tag=%s\npackage_sha256=%s\n' "$ROR_SOURCE_TAG_SHA" "$ROR_ZIP_SHA256" > artifacts/logs/audit-provenance.txt

      - name: Verify complete official RoR installation package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ror" "$RUNNER_TEMP/ror-home" artifacts/logs
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$ROR_ZIP_URL" -o "$RUNNER_TEMP/ror.zip"
          printf '%s  %s\n' "$ROR_ZIP_SHA256" "$RUNNER_TEMP/ror.zip" | sha256sum -c - | tee artifacts/logs/ror-zip-sha256-check.txt
          unzip -t "$RUNNER_TEMP/ror.zip" > artifacts/logs/ror-zip-test.txt
          grep -F 'No errors detected' artifacts/logs/ror-zip-test.txt
          unzip -q "$RUNNER_TEMP/ror.zip" -d "$RUNNER_TEMP/ror"

          ROR_DIR="$RUNNER_TEMP/ror"
          ROR_TEST_HOME="$RUNNER_TEMP/ror-home"
          if [[ -d "$ROR_DIR/config" ]]; then
            ROR_USER_DIR="$ROR_DIR/config"
          else
            ROR_USER_DIR="$ROR_TEST_HOME/.rigsofrods"
          fi
          ROR_LOG="$ROR_USER_DIR/logs/RoR.log"
          echo "ROR_DIR=$ROR_DIR" >> "$GITHUB_ENV"
          echo "ROR_TEST_HOME=$ROR_TEST_HOME" >> "$GITHUB_ENV"
          echo "ROR_USER_DIR=$ROR_USER_DIR" >> "$GITHUB_ENV"
          echo "ROR_LOG=$ROR_LOG" >> "$GITHUB_ENV"

          test -f "$ROR_DIR/RoR" && chmod +x "$ROR_DIR/RoR"
          test -f "$ROR_DIR/RunRoR" && chmod +x "$ROR_DIR/RunRoR"
          test -f "$ROR_DIR/plugins.cfg"
          test -d "$ROR_DIR/lib"
          test -d "$ROR_DIR/resources/managed_materials"
          test -d "$ROR_DIR/content"
          cp "$ROR_DIR/RunRoR" artifacts/logs/RunRoR.txt
          cp "$ROR_DIR/plugins.cfg" artifacts/logs/plugins.cfg
          grep -F 'LD_LIBRARY_PATH' artifacts/logs/RunRoR.txt
          grep -F './RoR "$@"' artifacts/logs/RunRoR.txt

          resources=(OgreCore.zip SkyX.zip airfoils.zip beamobjects.zip caelum.zip cubemaps.zip dashboards.zip famicons.zip flags.zip fonts.zip hydrax.zip icons.zip managed_materials.zip materials.zip meshes.zip mygui.zip overlays.zip paged.zip particles.zip rtshader.zip scripts.zip skeleton.zip sounds.zip textures.zip wallpapers.zip)
          content=(An-12.zip agora.zip dafsemi.zip nhelens.zip simple2-terrain.zip wahoo.zip)
          : > artifacts/logs/package-zip-integrity.txt
          for name in "${resources[@]}"; do test -f "$ROR_DIR/resources/$name"; unzip -t "$ROR_DIR/resources/$name" >/dev/null; echo "PASS resources/$name" >> artifacts/logs/package-zip-integrity.txt; done
          for name in "${content[@]}"; do test -f "$ROR_DIR/content/$name"; unzip -t "$ROR_DIR/content/$name" >/dev/null; echo "PASS content/$name" >> artifacts/logs/package-zip-integrity.txt; done
          test "$(wc -l < artifacts/logs/package-zip-integrity.txt)" -eq 31
          test -f "$ROR_DIR/resources/managed_materials/managed_mats.material"
          test -f "$ROR_DIR/resources/managed_materials/managed_mats_vehicles.material"
          find "$ROR_DIR" -maxdepth 3 -type f | sort > artifacts/logs/ror-package-files.txt

          map_matches=(); truck_matches=()
          while IFS= read -r archive; do
            while IFS= read -r entry; do
              [[ "$entry" =~ (^|/)simple2\.terrn2$ ]] && map_matches+=("$archive|$entry")
              [[ "$entry" =~ (^|/).*semi\.truck$ ]] && truck_matches+=("$archive|$entry")
            done < <(unzip -Z1 "$archive")
          done < <(find "$ROR_DIR/content" -maxdepth 1 -type f -name '*.zip' -print | sort)
          test "${#map_matches[@]}" -eq 1
          test "${#truck_matches[@]}" -eq 1
          ROR_MAP="$(basename "${map_matches[0]#*|}")"
          ROR_TRUCK="$(basename "${truck_matches[0]#*|}")"
          echo "ROR_MAP=$ROR_MAP" >> "$GITHUB_ENV"
          echo "ROR_TRUCK=$ROR_TRUCK" >> "$GITHUB_ENV"
          printf 'ROR_MAP=%s\nROR_TRUCK=%s\n' "$ROR_MAP" "$ROR_TRUCK" | tee artifacts/logs/discovered-scene.txt

      - name: Verify RoR binary and plugin closure
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/logs/ldd
          export LD_LIBRARY_PATH="$ROR_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          check_ldd() {
            local target="$1" label="$2" out="artifacts/logs/ldd/$2.txt" rc
            set +e; ldd "$target" > "$out" 2>&1; rc=$?; set -e
            (( rc == 0 )) || { cat "$out" >&2; return 1; }
            ! grep -q 'not found' "$out" || { cat "$out" >&2; return 1; }
          }

          file "$ROR_DIR/RoR" | tee artifacts/logs/ror-file.txt
          check_ldd "$ROR_DIR/RoR" RoR
          plugin_folder="$(awk -F= '/^[[:space:]]*PluginFolder[[:space:]]*=/ {sub(/^[^=]*=/, ""); gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}' "$ROR_DIR/plugins.cfg")"
          test -n "$plugin_folder"
          [[ "$plugin_folder" = /* ]] && plugin_base="$plugin_folder" || plugin_base="$ROR_DIR/$plugin_folder"
          plugin_base="$(realpath "$plugin_base")"
          : > artifacts/logs/resolved-plugins.txt
          count=0
          while IFS= read -r line; do
            plugin="${line#*=}"; plugin="${plugin//$'\r'/}"; plugin="$(echo "$plugin" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            [[ -n "$plugin" ]] || continue
            count=$((count+1)); candidates=("$plugin_base/$plugin")
            [[ "$plugin" == *.so || "$plugin" == *.so.* ]] || candidates+=("$plugin_base/${plugin}.so")
            target=''; for candidate in "${candidates[@]}"; do [[ -f "$candidate" ]] && { [[ -z "$target" ]] || exit 1; target="$candidate"; }; done
            test -n "$target"
            target="$(realpath "$target")"; label="$(basename "$target" | sed -E 's/[^A-Za-z0-9_.-]+/_/g')"
            echo "Plugin=$plugin -> $target" | tee -a artifacts/logs/resolved-plugins.txt
            check_ldd "$target" "$label"
          done < <(grep -E '^[[:space:]]*Plugin[[:space:]]*=' "$ROR_DIR/plugins.cfg")
          (( count > 0 ))

          cd "$ROR_DIR"
          set +e
          env -u SNAP_USER_COMMON HOME="$ROR_TEST_HOME" ./RunRoR -version > "$GITHUB_WORKSPACE/artifacts/logs/ror-version.txt" 2>&1
          rc=$?
          set -e
          cat "$GITHUB_WORKSPACE/artifacts/logs/ror-version.txt"
          (( rc == 0 ))
          grep -F 'Version Information: Rigs of Rods' "$GITHUB_WORKSPACE/artifacts/logs/ror-version.txt"
          grep -E '^ protocol version: .+' "$GITHUB_WORKSPACE/artifacts/logs/ror-version.txt"
          grep -E '^ build time: .+' "$GITHUB_WORKSPACE/artifacts/logs/ror-version.txt"

      - name: Prove X11/OpenGL and capture real RoR scene
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/logs "$ROR_TEST_HOME"
          XVFB_PID=''; ROR_PID=''
          cleanup() {
            set +e
            [[ -n "$ROR_PID" ]] && { kill -TERM "$ROR_PID" 2>/dev/null || true; sleep 1; kill -KILL "$ROR_PID" 2>/dev/null || true; wait "$ROR_PID" 2>/dev/null || true; }
            [[ -n "$XVFB_PID" ]] && { kill -TERM "$XVFB_PID" 2>/dev/null || true; wait "$XVFB_PID" 2>/dev/null || true; }
          }
          trap cleanup EXIT

          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac +extension GLX +render -noreset -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          ready=0
          for _ in $(seq 1 30); do xdpyinfo -display "$DISPLAY" > artifacts/logs/xdpyinfo.txt 2>&1 && { ready=1; break; }; kill -0 "$XVFB_PID" 2>/dev/null || break; sleep 0.5; done
          (( ready == 1 )) || { cat "$RUNNER_TEMP/xvfb.log" >&2 || true; exit 1; }
          glxinfo -B | tee artifacts/logs/glxinfo.txt
          set +e; timeout 4s glxgears > artifacts/logs/glxgears.txt 2>&1; glx_rc=$?; set -e
          (( glx_rc == 0 || glx_rc == 124 ))

          cd "$ROR_DIR"
          env -u SNAP_USER_COMMON HOME="$ROR_TEST_HOME" ./RunRoR -map "$ROR_MAP" -truck "$ROR_TRUCK" -enter > "$RUNNER_TEMP/ror-runtime.stdout.log" 2>&1 &
          ROR_PID=$!
          scene_ready=0
          for second in $(seq 1 "$SCENE_START_TIMEOUT_SECONDS"); do
            sleep 1
            kill -0 "$ROR_PID" 2>/dev/null || { cat "$RUNNER_TEMP/ror-runtime.stdout.log" >&2 || true; [[ -f "$ROR_LOG" ]] && cat "$ROR_LOG" >&2 || true; exit 1; }
            if [[ -f "$ROR_LOG" ]]; then
              grep -Eqi 'Startup error|No render system plugin available|Terrain loading error|Terrain not found:|FATAL ERROR' "$ROR_LOG" && { grep -Ein 'Startup error|No render system plugin available|Terrain loading error|Terrain not found:|FATAL ERROR' "$ROR_LOG" >&2 || true; exit 1; }
              if awk -v map="$ROR_MAP" -v truck="$ROR_TRUCK" 'index($0,"===== LOADING TERRAIN " map){t=NR} index($0,"[RoR|Diag] Preselected Truck:")&&index($0,truck)&&t{p=NR} index($0,"===== DONE LOADING VEHICLE")&&p&&NR>p{d=NR} END{exit !(t&&p>t&&d>p)}' "$ROR_LOG"; then scene_ready=1; break; fi
            fi
          done
          (( scene_ready == 1 )) || { [[ -f "$ROR_LOG" ]] && cat "$ROR_LOG" >&2 || true; exit 1; }
          sleep 3; kill -0 "$ROR_PID"

          cd "$GITHUB_WORKSPACE"
          xwininfo -root -tree > artifacts/logs/xwininfo-tree.txt
          ROR_WINDOW_ID="$(awk '/"Rigs of Rods version/ {print $1; exit}' artifacts/logs/xwininfo-tree.txt)"
          test -n "$ROR_WINDOW_ID"
          xwininfo -id "$ROR_WINDOW_ID" > artifacts/logs/xwininfo-ror.txt
          cp "$ROR_LOG" artifacts/logs/RoR-before-capture.log
          cp "$RUNNER_TEMP/ror-runtime.stdout.log" artifacts/logs/ror-runtime.stdout.log
          cp "$RUNNER_TEMP/xvfb.log" artifacts/logs/xvfb.log

          timeout "$((CAPTURE_SECONDS+15))" ffmpeg -hide_banner -loglevel warning -y -thread_queue_size 512 \
            -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate "$CAPTURE_FPS" -i "${DISPLAY}.0" \
            -t "$CAPTURE_SECONDS" -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p artifacts/ror-video-smoke.mp4 \
            > artifacts/logs/ffmpeg-capture.out 2> artifacts/logs/ffmpeg-capture.err
          kill -0 "$ROR_PID"
          cp "$ROR_LOG" artifacts/logs/RoR-after-capture.log

      - name: Validate real video evidence
        shell: bash
        run: |
          set -euxo pipefail
          VIDEO='artifacts/ror-video-smoke.mp4'; test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO" | tee artifacts/ffprobe.txt
          CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$VIDEO")"
          SIZE="$(stat -c '%s' "$VIDEO")"
          python3 - "$CODEC" "$DURATION" "$WIDTH" "$HEIGHT" "$FRAMES" "$SIZE" "$CAPTURE_SECONDS" <<'PY'
          import sys
          codec,dur,w,h,frames,size,req=sys.argv[1],float(sys.argv[2]),int(sys.argv[3]),int(sys.argv[4]),int(sys.argv[5]),int(sys.argv[6]),float(sys.argv[7])
          bad=[]
          if codec!='h264': bad.append(f'codec={codec}')
          if dur<req-1: bad.append(f'duration={dur}')
          if (w,h)!=(1280,720): bad.append(f'resolution={w}x{h}')
          if frames<=0: bad.append(f'frames={frames}')
          if size<=0: bad.append(f'size={size}')
          if bad: raise SystemExit('VIDEO_CONTAINER_GATE_FAIL: '+'; '.join(bad))
          print('VIDEO_CONTAINER_GATE_PASS')
          PY
          ffmpeg -hide_banner -v error -i "$VIDEO" -f null -
          BLACK_LIMIT="$(python3 - "$DURATION" <<'PY'
          import sys; print(max(1.0,float(sys.argv[1])-2.0))
          PY
          )"
          ffmpeg -hide_banner -i "$VIDEO" -vf "blackdetect=d=${BLACK_LIMIT}:pix_th=0.02" -an -f null - >/dev/null 2> artifacts/blackdetect.txt || true
          python3 - artifacts/blackdetect.txt "$DURATION" <<'PY'
          import re,sys
          from pathlib import Path
          duration=float(sys.argv[2]); spans=[float(x) for x in re.findall(r'black_duration:([0-9.]+)',Path(sys.argv[1]).read_text(errors='replace'))]; longest=max(spans,default=0.0); limit=max(1.0,duration-2.0)
          if longest>=limit: raise SystemExit(f'VIDEO_BLACK_GATE_FAIL longest={longest} limit={limit}')
          print(f'VIDEO_BLACK_GATE_PASS longest={longest}')
          PY
          MID="$(python3 - "$DURATION" <<'PY'
          import sys; print(float(sys.argv[1])/2)
          PY
          )"
          ffmpeg -hide_banner -loglevel error -y -ss "$MID" -i "$VIDEO" -frames:v 1 artifacts/midframe.png
          test -s artifacts/midframe.png
          ! grep -Eqi 'Startup error|No render system plugin available|Terrain loading error|Terrain not found:|FATAL ERROR' artifacts/logs/RoR-after-capture.log
          awk -v map="$ROR_MAP" -v truck="$ROR_TRUCK" 'index($0,"===== LOADING TERRAIN " map){t=NR} index($0,"[RoR|Diag] Preselected Truck:")&&index($0,truck)&&t{p=NR} index($0,"===== DONE LOADING VEHICLE")&&p&&NR>p{d=NR} END{exit !(t&&p>t&&d>p)}' artifacts/logs/RoR-after-capture.log
          echo 'ROR_VIDEO_SMOKE_ACCEPTANCE=PASS' | tee artifacts/acceptance.txt

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/logs
          [[ -f "$RUNNER_TEMP/xvfb.log" ]] && cp "$RUNNER_TEMP/xvfb.log" artifacts/logs/xvfb-final.log
          [[ -f "$RUNNER_TEMP/ror-runtime.stdout.log" ]] && cp "$RUNNER_TEMP/ror-runtime.stdout.log" artifacts/logs/ror-runtime.stdout-final.log
          [[ -n "${ROR_LOG:-}" && -f "$ROR_LOG" ]] && cp "$ROR_LOG" artifacts/logs/RoR-final.log
          [[ -n "${ROR_USER_DIR:-}" && -d "$ROR_USER_DIR/config" ]] && find "$ROR_USER_DIR/config" -maxdepth 1 -type f -print > artifacts/logs/ror-config-files.txt 2>&1 || true
          ps auxww > artifacts/logs/ps-final.txt 2>&1 || true
          true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ror-video-smoke-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
