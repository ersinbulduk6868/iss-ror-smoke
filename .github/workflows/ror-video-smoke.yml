name: RoR video smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ror-video-smoke.yml'

permissions:
  contents: read

env:
  ROR_VERSION: '2022.12'
  ROR_ZIP_URL: 'https://downloads.sourceforge.net/project/rigs-of-rods/Releases/2022.12/RoR-2022.12-linux.zip'
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: '1'
  ALSOFT_DRIVERS: 'null'

jobs:
  render-smoke:
    name: Native Linux RoR audited software-render smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audited runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip file python3 procps psmisc \
            xvfb x11-utils xauth dbus-x11 \
            ffmpeg mesa-utils libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa \
            libx11-6 libxext6 libxrender1 libxi6 libxrandr2 libxinerama1 \
            libxcursor1 libxfixes3 libfontconfig1 libfreetype6 \
            libopenal1 libpulse0 libgtk-3-0

      - name: Runner command preflight
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/logs
          required=(
            curl unzip file python3 Xvfb xdpyinfo glxinfo glxgears
            ffmpeg ffprobe ldd sha256sum timeout grep sed awk find sort tee basename stat
          )
          for cmd in "${required[@]}"; do
            command -v "$cmd"
          done
          uname -a > artifacts/logs/runner-preflight.txt
          lsb_release -a >> artifacts/logs/runner-preflight.txt 2>&1 || true
          ffmpeg -version | sed -n '1p' >> artifacts/logs/runner-preflight.txt

      - name: Download and audit official RoR portable package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ror" artifacts/logs

          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "$ROR_ZIP_URL" -o "$RUNNER_TEMP/ror.zip"

          sha256sum "$RUNNER_TEMP/ror.zip" | tee artifacts/logs/ror-zip-sha256.txt
          unzip -t "$RUNNER_TEMP/ror.zip" > artifacts/logs/ror-zip-test.txt
          grep -F 'No errors detected' artifacts/logs/ror-zip-test.txt
          unzip -q "$RUNNER_TEMP/ror.zip" -d "$RUNNER_TEMP/ror"

          ROR_DIR="$RUNNER_TEMP/ror"
          ROR_BIN="$ROR_DIR/RoR"
          ROR_LAUNCHER="$ROR_DIR/RunRoR"

          test -f "$ROR_BIN"
          test -f "$ROR_LAUNCHER"
          test -f "$ROR_DIR/plugins.cfg"
          test -f "$ROR_DIR/lib/RenderSystem_GL.so"
          test -f "$ROR_DIR/resources/OgreCore.zip"
          test -f "$ROR_DIR/content/simple2-terrain.zip"
          test -f "$ROR_DIR/content/dafsemi.zip"
          chmod +x "$ROR_BIN" "$ROR_LAUNCHER"

          unzip -Z1 "$ROR_DIR/content/simple2-terrain.zip" > artifacts/logs/simple2-contents.txt
          unzip -Z1 "$ROR_DIR/content/dafsemi.zip" > artifacts/logs/dafsemi-contents.txt

          MAP_ENTRY="$(awk '/(^|\/)simple2\.terrn2$/ {print; exit}' artifacts/logs/simple2-contents.txt)"
          TRUCK_ENTRY="$(awk '/(^|\/).*semi\.truck$/ {print; exit}' artifacts/logs/dafsemi-contents.txt)"

          if [[ -z "$MAP_ENTRY" ]]; then
            echo 'Could not discover simple2 terrain entry from the official package.' >&2
            cat artifacts/logs/simple2-contents.txt >&2
            exit 1
          fi
          if [[ -z "$TRUCK_ENTRY" ]]; then
            echo 'Could not discover semi truck entry from the official package.' >&2
            cat artifacts/logs/dafsemi-contents.txt >&2
            exit 1
          fi

          ROR_MAP="$(basename "$MAP_ENTRY")"
          ROR_TRUCK="$(basename "$TRUCK_ENTRY")"
          printf 'ROR_MAP=%s\nROR_TRUCK=%s\n' "$ROR_MAP" "$ROR_TRUCK" \
            | tee artifacts/logs/discovered-scene.txt

          find "$ROR_DIR" -maxdepth 3 -type f | sort > artifacts/logs/ror-package-files.txt

          echo "ROR_DIR=$ROR_DIR" >> "$GITHUB_ENV"
          echo "ROR_BIN=$ROR_BIN" >> "$GITHUB_ENV"
          echo "ROR_LAUNCHER=$ROR_LAUNCHER" >> "$GITHUB_ENV"
          echo "ROR_MAP=$ROR_MAP" >> "$GITHUB_ENV"
          echo "ROR_TRUCK=$ROR_TRUCK" >> "$GITHUB_ENV"

      - name: Audit executable and startup plugin dependency closure
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/logs/ldd

          mapfile -t LIB_DIRS < <(
            find "$ROR_DIR" \( -type f -o -type l \) -name '*.so*' -printf '%h\n' | sort -u
          )
          if (( ${#LIB_DIRS[@]} == 0 )); then
            echo 'No bundled shared-library directories found.' >&2
            exit 1
          fi

          ROR_LIB_PATH="$(IFS=:; echo "${LIB_DIRS[*]}")"
          echo "ROR_LIB_PATH=$ROR_LIB_PATH" | tee artifacts/logs/ror-library-path.txt

          check_ldd() {
            local target="$1"
            local label="$2"
            local outfile="artifacts/logs/ldd/${label}.txt"
            env LD_LIBRARY_PATH="$ROR_LIB_PATH" ldd "$target" > "$outfile" 2>&1 || true
            if grep -q 'not found' "$outfile"; then
              echo "Unresolved dependency in $target" >&2
              cat "$outfile" >&2
              return 1
            fi
          }

          file "$ROR_BIN" | tee artifacts/logs/ror-file.txt
          check_ldd "$ROR_BIN" 'RoR'

          plugin_fail=0
          while IFS= read -r line; do
            plugin="${line#Plugin=}"
            plugin="${plugin//$'\r'/}"
            [[ -n "$plugin" ]] || continue
            target="$ROR_DIR/lib/${plugin}.so"
            if [[ ! -f "$target" ]]; then
              echo "Plugin listed in plugins.cfg is missing: $target" >&2
              plugin_fail=1
              continue
            fi
            check_ldd "$target" "${plugin//\//_}" || plugin_fail=1
          done < <(grep -E '^Plugin=' "$ROR_DIR/plugins.cfg")

          (( plugin_fail == 0 ))

      - name: Start and prove X11 software OpenGL stack
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/logs

          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset \
            >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!

          ready=0
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 > artifacts/logs/xdpyinfo-full.txt 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$XVFB_PID" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          if (( ready == 0 )); then
            echo 'Xvfb did not become ready.' >&2
            cat "$RUNNER_TEMP/xvfb.log" >&2 || true
            exit 1
          fi

          sed -n '1,80p' artifacts/logs/xdpyinfo-full.txt > artifacts/logs/xdpyinfo.txt
          glxinfo -B > artifacts/logs/glxinfo.txt 2>&1
          cat artifacts/logs/glxinfo.txt
          grep -Eq '^OpenGL renderer string: .+' artifacts/logs/glxinfo.txt

          set +e
          timeout 4s glxgears >"$RUNNER_TEMP/glxgears.log" 2>&1
          GLXGEARS_RC=$?
          set -e
          if [[ "$GLXGEARS_RC" -ne 0 && "$GLXGEARS_RC" -ne 124 ]]; then
            echo "glxgears failed with exit code $GLXGEARS_RC" >&2
            cat "$RUNNER_TEMP/glxgears.log" >&2 || true
            exit 1
          fi

      - name: Launch deterministic RoR scene and capture video
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/logs

          ffmpeg -hide_banner -loglevel warning -y \
            -thread_queue_size 512 \
            -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
            -t 45 -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p \
            artifacts/ror-video-smoke.mp4 \
            >"$RUNNER_TEMP/ffmpeg.out" 2>"$RUNNER_TEMP/ffmpeg.err" &
          FFMPEG_PID=$!

          cd "$ROR_DIR"
          ./RunRoR -map "$ROR_MAP" -truck "$ROR_TRUCK" -enter \
            >"$RUNNER_TEMP/ror-runtime.log" 2>&1 &
          ROR_PID=$!
          echo "RoR PID: $ROR_PID"

          for second in $(seq 1 40); do
            sleep 1
            if ! kill -0 "$ROR_PID" 2>/dev/null; then
              echo "RoR exited before the 40-second runtime checkpoint at second $second." >&2
              cat "$RUNNER_TEMP/ror-runtime.log" >&2 || true
              wait "$ROR_PID" || true
              exit 1
            fi
            if ! kill -0 "$FFMPEG_PID" 2>/dev/null; then
              echo "ffmpeg exited early at second $second." >&2
              cat "$RUNNER_TEMP/ffmpeg.err" >&2 || true
              wait "$FFMPEG_PID" || true
              exit 1
            fi
          done

          echo 'RoR runtime survival checkpoint PASS: 40 seconds.'
          kill -TERM "$ROR_PID" 2>/dev/null || true
          sleep 2
          kill -KILL "$ROR_PID" 2>/dev/null || true
          wait "$ROR_PID" 2>/dev/null || true
          wait "$FFMPEG_PID"

          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/ror-runtime.log" artifacts/logs/ror-runtime.log || true
          cp "$RUNNER_TEMP/ffmpeg.out" artifacts/logs/ffmpeg.out || true
          cp "$RUNNER_TEMP/ffmpeg.err" artifacts/logs/ffmpeg.err || true
          cp "$RUNNER_TEMP/xvfb.log" artifacts/logs/xvfb.log || true
          cp "$RUNNER_TEMP/glxgears.log" artifacts/logs/glxgears.log || true

          find "$HOME" "$ROR_DIR" -type f \( -name 'RoR.log' -o -name 'ogre.cfg' -o -name 'RoR.cfg' \) \
            -print 2>/dev/null > artifacts/logs/ror-generated-files.txt || true
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue
            cp "$f" "artifacts/logs/$(basename "$f")" || true
          done < artifacts/logs/ror-generated-files.txt

      - name: Validate captured video
        shell: bash
        run: |
          set -euxo pipefail
          VIDEO='artifacts/ror-video-smoke.mp4'
          test -s "$VIDEO"

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,avg_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee artifacts/ffprobe.txt

          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$VIDEO")"
          SIZE_BYTES="$(stat -c '%s' "$VIDEO")"

          python3 - "$DURATION" "$WIDTH" "$HEIGHT" "$FRAMES" "$SIZE_BYTES" <<'PY'
          import sys
          duration = float(sys.argv[1])
          width = int(sys.argv[2])
          height = int(sys.argv[3])
          frames = int(sys.argv[4])
          size_bytes = int(sys.argv[5])
          problems = []
          if duration < 38.0:
              problems.append(f'duration {duration:.3f}s < 38s')
          if (width, height) != (1280, 720):
              problems.append(f'resolution {width}x{height} != 1280x720')
          if frames < 900:
              problems.append(f'frames {frames} < 900')
          if size_bytes < 100_000:
              problems.append(f'file size {size_bytes} < 100000 bytes')
          if problems:
              raise SystemExit('VIDEO_GATE_FAIL: ' + '; '.join(problems))
          print(f'VIDEO_BASIC_GATE_PASS duration={duration:.3f}s frames={frames} size={size_bytes}')
          PY

          ffmpeg -hide_banner -loglevel error -i "$VIDEO" \
            -vf "fps=1,signalstats,metadata=print:file=artifacts/signalstats.txt" \
            -an -f null -

          python3 - <<'PY'
          from pathlib import Path
          frames = []
          current = {}
          for line in Path('artifacts/signalstats.txt').read_text(errors='replace').splitlines():
              if line.startswith('frame:'):
                  if current:
                      frames.append(current)
                  current = {}
              elif line.startswith('lavfi.signalstats.') and '=' in line:
                  k, v = line.split('=', 1)
                  try:
                      current[k.rsplit('.', 1)[-1]] = float(v)
                  except ValueError:
                      pass
          if current:
              frames.append(current)
          usable = [f for f in frames if {'YAVG','YLOW','YHIGH'} <= f.keys()]
          if len(usable) < 20:
              raise SystemExit(f'VIDEO_SIGNAL_FAIL: only {len(usable)} usable samples')
          lit = [f for f in usable if f['YAVG'] >= 18 and (f['YHIGH'] - f['YLOW']) >= 12]
          if len(lit) < 5:
              raise SystemExit(f'VIDEO_SIGNAL_FAIL: only {len(lit)} clearly rendered frames')
          print(f'VIDEO_SIGNAL_PASS usable={len(usable)} clearly_rendered={len(lit)}')
          PY

          BLACK_LOG="$(ffmpeg -hide_banner -i "$VIDEO" -vf 'blackdetect=d=25:pix_th=0.05' -an -f null - 2>&1 || true)"
          printf '%s\n' "$BLACK_LOG" | tee artifacts/blackdetect.txt
          if printf '%s\n' "$BLACK_LOG" | grep -Eq 'black_duration:(2[5-9]|[3-9][0-9])'; then
            echo 'VIDEO_BLACK_GATE_FAIL: capture contains a >=25s continuous black interval.' >&2
            exit 1
          fi

          if [[ -f artifacts/logs/RoR.log ]]; then
            if grep -Eqi 'No render system plugin available|Could not load file.*plugins|Startup error' artifacts/logs/RoR.log; then
              echo 'ROR_LOG_GATE_FAIL: startup/rendering error marker found in RoR.log.' >&2
              grep -Ein 'No render system plugin available|Could not load file.*plugins|Startup error' artifacts/logs/RoR.log >&2 || true
              exit 1
            fi
          fi

          echo 'ROR_VIDEO_SMOKE_ACCEPTANCE=PASS' | tee artifacts/acceptance.txt

      - name: Collect final diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/logs
          for f in \
            "$RUNNER_TEMP/xvfb.log" \
            "$RUNNER_TEMP/glxinfo.log" \
            "$RUNNER_TEMP/glxgears.log" \
            "$RUNNER_TEMP/ror-runtime.log" \
            "$RUNNER_TEMP/ffmpeg.out" \
            "$RUNNER_TEMP/ffmpeg.err"; do
            if [[ -f "$f" ]]; then
              cp "$f" artifacts/logs/
            fi
          done
          ps auxww > artifacts/logs/ps-final.txt 2>&1 || true
          true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ror-video-smoke-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
