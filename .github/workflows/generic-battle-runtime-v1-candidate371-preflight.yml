name: ISS Generic Battle Runtime v1 Candidate 3.7.1 full-audited preflight

on:
  workflow_dispatch:
  push:
    branches:
      - iss-engineering/generic-battle-runtime-v1
    paths:
      - '.github/workflows/generic-battle-runtime-v1-candidate371-preflight.yml'
      - 'blender/run_generic_battle_runtime_v1_candidate371.py'
      - 'blender/run_generic_battle_runtime_v1_candidate37.py'
      - 'tools/validate_generic_battle_runtime_v1_candidate371_result.py'

concurrency:
  group: iss-generic-battle-runtime-v1-candidate371
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Generic battle runtime Candidate 3.7.1
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      BLENDER_VERSION: '4.5.13'
      EXPECTED_ASSET_SHA: '0b2710a840d128aee53161277edb8cb77e1930d339f53585c6faece3f1dc2b1c'

    steps:
      - name: Checkout exact Candidate 3.7.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Full static compile and lock-preservation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/iss_battle_runtime_contract.py \
            blender/iss_battle_runtime_models.py \
            blender/iss_battle_runtime_core.py \
            blender/iss_battle_runtime_assets.py \
            blender/iss_battle_runtime_physics.py \
            blender/iss_battle_runtime_consequences.py \
            blender/iss_battle_runtime_camera.py \
            blender/iss_battle_runtime_lifecycle.py \
            blender/iss_blender_battle_runtime_v1.py \
            blender/iss_blender_battle_runtime_v1_hardened.py \
            blender/run_generic_battle_runtime_v1_candidate34.py \
            blender/run_generic_battle_runtime_v1_candidate35.py \
            blender/run_generic_battle_runtime_v1_candidate36.py \
            blender/run_generic_battle_runtime_v1_candidate37.py \
            blender/run_generic_battle_runtime_v1_candidate371.py \
            tools/validate_generic_battle_runtime_v1.py \
            tools/validate_generic_battle_runtime_v1_candidate3.py \
            tools/validate_generic_battle_runtime_v1_candidate32_result.py \
            tools/validate_generic_battle_runtime_v1_candidate371_result.py
          python3 tools/validate_generic_battle_runtime_v1_candidate3.py | tee generic-runtime-static.log
          grep -q '"status": "PASS"' generic-runtime-static.log
          grep -q 'ACTOR_LOCAL_SURFACE_AWARE_CAUSAL_DAMAGE_V1' blender/run_generic_battle_runtime_v1_candidate37.py
          grep -q 'DAMAGE_REALIZATION_TRANSFORM_PASS' blender/run_generic_battle_runtime_v1_candidate37.py
          grep -q 'DAMAGE_SURFACE_LOCALIZATION_PASS' blender/run_generic_battle_runtime_v1_candidate37.py
          grep -q 'truthfulVisualReceiptFrame.*True' blender/run_generic_battle_runtime_v1_candidate371.py
          grep -q 'damageThresholdChanged.*False' blender/run_generic_battle_runtime_v1_candidate371.py
          grep -q 'contactThresholdChanged.*False' blender/run_generic_battle_runtime_v1_candidate371.py
          grep -q 'actorPoseOrVelocityMutation.*False' blender/run_generic_battle_runtime_v1_candidate371.py
          ! grep -Eq 'actor_(alpha|beta).*(location|rotation|linear_velocity|angular_velocity)' blender/run_generic_battle_runtime_v1_candidate37.py blender/run_generic_battle_runtime_v1_candidate371.py
          ! grep -Eq 'MIN_DAMAGE_SEVERITY\s*=|SEMANTIC.*TOLERANCE|tolerance.*=' blender/run_generic_battle_runtime_v1_candidate37.py blender/run_generic_battle_runtime_v1_candidate371.py
          echo 'GENERIC_BATTLE_RUNTIME_CANDIDATE371_STATIC=PASS'

      - name: Build exact generic preflight fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum assets/generated/generic-hypercar-v1/generic_hypercar.glb | awk '{print $1}')" = "$EXPECTED_ASSET_SHA"
          python3 tools/build_generic_battle_runtime_v1_preflight.py | tee generic-runtime-fixture.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_PREFLIGHT_FIXTURE_PASS"' generic-runtime-fixture.log
          echo 'GENERIC_BATTLE_RUNTIME_FIXTURE=PASS'

      - name: Install Blender runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            xz-utils ffmpeg libgl1 libegl1 libx11-6 libxi6 libxrender1 \
            libxfixes3 libxxf86vm1 libxkbcommon0 >/dev/null
          echo 'GENERIC_BATTLE_RUNTIME_DEPENDENCIES=PASS'

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          ARCHIVE=".blender/blender-${BLENDER_VERSION}.tar.xz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o "$ARCHIVE"
          tar -xJf "$ARCHIVE" -C .blender
          BLENDER_BIN="$GITHUB_WORKSPACE/.blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          test -x "$BLENDER_BIN"
          "$BLENDER_BIN" --version | tee blender-version.log
          grep -q "Blender ${BLENDER_VERSION}" blender-version.log
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"
          echo 'GENERIC_BATTLE_RUNTIME_BLENDER_VERSION=PASS'

      - name: Run Candidate 3.7.1 solver-driven full preflight
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python blender/run_generic_battle_runtime_v1_candidate371.py \
            -- \
            --request artifacts/generic-battle-runtime-v1-preflight/request.json \
            --asset-map artifacts/generic-battle-runtime-v1-preflight/asset-map.json \
            --output-dir artifacts/generic-battle-runtime-v1-preflight \
            --render-previews \
            2>&1 | tee generic-runtime-blender.log
          grep -q 'GENERIC_BATTLE_RUNTIME_CANDIDATE371_ENGINE_HARDENING_PASS' generic-runtime-blender.log
          grep -q 'DRIVE_RIG_AUTHORITY_CALIBRATED' generic-runtime-blender.log
          grep -q 'DAMAGE_REALIZATION_TRANSFORM_PASS' generic-runtime-blender.log
          grep -q 'DAMAGE_SURFACE_LOCALIZATION_PASS' generic-runtime-blender.log
          grep -q 'DAMAGE_VISUAL_TEMPORAL_BINDING_PASS' generic-runtime-blender.log
          grep -q 'DEBRIS_CAUSAL_REALIZATION_PASS' generic-runtime-blender.log
          grep -q 'CONSEQUENCE_CONTACT_TO_REALIZATION_BINDING_PASS' generic-runtime-blender.log
          grep -q 'IMPACT_CONSEQUENCE_APPLIED' generic-runtime-blender.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_RESULT"' generic-runtime-blender.log
          grep -q '"success": true' generic-runtime-blender.log
          echo 'GENERIC_BATTLE_RUNTIME_CANDIDATE371_EXECUTION=PASS'

      - name: Validate Candidate 3.7.1 machine truth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_generic_battle_runtime_v1_candidate371_result.py \
            --evidence artifacts/generic-battle-runtime-v1-preflight/generic-battle-runtime-v1-evidence.json \
            | tee generic-runtime-result-validation.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_CANDIDATE371_MACHINE_PREFLIGHT"' generic-runtime-result-validation.log
          grep -q '"status": "PASS"' generic-runtime-result-validation.log
          echo 'GENERIC_BATTLE_RUNTIME_CANDIDATE371_MACHINE_PREFLIGHT=PASS'

      - name: Build temporally ordered review strip
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APPROACH="$(find artifacts/generic-battle-runtime-v1-preflight -maxdepth 1 -type f -name 'preview-approach-*.png' -print -quit)"
          IMPACT="$(find artifacts/generic-battle-runtime-v1-preflight -maxdepth 1 -type f -name 'preview-impact-*.png' -print -quit)"
          AFTERMATH="$(find artifacts/generic-battle-runtime-v1-preflight -maxdepth 1 -type f -name 'preview-aftermath-*.png' -print -quit)"
          test -n "$APPROACH" && test -n "$IMPACT" && test -n "$AFTERMATH"
          ffmpeg -y -i "$APPROACH" -i "$IMPACT" -i "$AFTERMATH" \
            -filter_complex 'hstack=inputs=3' -frames:v 1 \
            artifacts/generic-battle-runtime-v1-preflight/review-strip.jpg
          test -s artifacts/generic-battle-runtime-v1-preflight/review-strip.jpg
          sha256sum artifacts/generic-battle-runtime-v1-preflight/review-strip.jpg \
            | tee artifacts/generic-battle-runtime-v1-preflight/review-strip.sha256
          echo 'GENERIC_BATTLE_RUNTIME_CANDIDATE371_REVIEW_STRIP=PASS'

      - name: Upload Candidate 3.7.1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-generic-battle-runtime-v1-candidate371-${{ github.run_id }}
          path: |
            generic-runtime-static.log
            generic-runtime-fixture.log
            generic-runtime-blender.log
            generic-runtime-result-validation.log
            blender-version.log
            artifacts/generic-battle-runtime-v1-preflight/
          if-no-files-found: warn
          retention-days: 7
