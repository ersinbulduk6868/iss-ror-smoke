name: ISS Generic Battle Runtime v1 Candidate 3.8.1 exact Bugatti preflight

on:
  workflow_dispatch:
  push:
    branches:
      - iss-engineering/generic-battle-runtime-v1
    paths:
      - '.github/workflows/generic-battle-runtime-v1-candidate381-bugatti-preflight.yml'
      - 'blender/run_generic_battle_runtime_v1_candidate381.py'
      - 'tools/validate_generic_battle_runtime_v1_candidate381_result.py'

concurrency:
  group: iss-generic-battle-runtime-v1-candidate381-bugatti
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  BLENDER_VERSION: '4.5.13'
  EXPECTED_BUGATTI_SHA: '8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
  SOURCE_ARTIFACT_ID: '10389794595'

jobs:
  preflight:
    name: Candidate 3.8.1 exact Bugatti generic runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact Candidate 3.8.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Static lock and generic hardening audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/run_generic_battle_runtime_v1_candidate381.py \
            tools/validate_generic_battle_runtime_v1_candidate381_result.py \
            tools/build_generic_battle_runtime_v1_bugatti_preflight.py \
            tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py
          python3 tools/validate_generic_battle_runtime_v1_candidate3.py | tee generic-runtime-static.log
          grep -q '"status": "PASS"' generic-runtime-static.log
          ! grep -Eq 'Object_3|Object_4|ALs_CARS|110EBsupersport_BUGATTI|seed_velocity|impact_damage|want_front_sign' blender/run_generic_battle_runtime_v1_candidate381.py
          grep -q 'damageThresholdChanged.*False' blender/run_generic_battle_runtime_v1_candidate381.py
          grep -q 'contactThresholdChanged.*False' blender/run_generic_battle_runtime_v1_candidate381.py
          grep -q 'scenarioTrajectoryHardcode.*False' blender/run_generic_battle_runtime_v1_candidate381.py
          grep -q 'bugattiSpecificObjectIds.*False' blender/run_generic_battle_runtime_v1_candidate381.py
          echo 'CANDIDATE381_STATIC_LOCK_AUDIT=PASS'

      - name: Reuse proven Candidate 3.8 exact Bugatti access receipt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/visual-vnext-rc2-preflight /tmp/c38
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/c38.zip
          unzip -q /tmp/c38.zip -d /tmp/c38
          cp /tmp/c38/artifacts/visual-vnext-rc2-preflight/asset-access.json artifacts/visual-vnext-rc2-preflight/asset-access.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json',encoding='utf-8'))
          a=d['asset']
          assert d.get('success') is True and d.get('status')=='BUGATTI_PAIR_ACCESS_READY'
          assert a['expectedSha256']==os.environ['EXPECTED_BUGATTI_SHA']
          assert int(a['expectedBytes'])==31576440 and int(a['pairCount'])==2
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUGATTI_SOURCE_URL='+a['signedUrl']+'\n')
          print('PROVEN_CANDIDATE38_ASSET_ACCESS_REUSED=PASS')
          PY

      - name: Acquire and validate exact full-source Bugatti
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py 2>&1 | tee bugatti-asset-preflight.log
          grep -q 'BUGATTI_DUEL_EXACT_SHA=PASS' bugatti-asset-preflight.log
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/assets.json',encoding='utf-8'))
          a=d['assets']['bugattiA']; b=d['assets']['bugattiB']
          assert d['status']=='PASS' and d['visualProxyForbidden'] is True and d['quant120Forbidden'] is True
          assert a['identity']['binaryExact'] is True and b['identity']['binaryExact'] is True
          assert a['identity']['primarySceneSha256']==b['identity']['primarySceneSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          assert a['sourceIdentity']['uid']==b['sourceIdentity']['uid']=='4af92c51ecdd4efa9b1c19a1163d9f46'
          print('BUGATTI_PRIMARY='+a['primaryScene'])
          PY

      - name: Build two-sided exact Bugatti generic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_generic_battle_runtime_v1_bugatti_preflight.py --bugatti-primary "$BUGATTI_PRIMARY" | tee generic-runtime-bugatti-fixture.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_BUGATTI_FIXTURE_PASS"' generic-runtime-bugatti-fixture.log
          grep -q '"twoSidedControllerIntent": true' generic-runtime-bugatti-fixture.log
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/generic-battle-runtime-v1-bugatti-preflight/request.json',encoding='utf-8'))
          assert len(d['assetBindings'])==2
          assert all((b.get('runtimeProfile') or {}).get('forwardAxis') is None for b in d['assetBindings'])
          impacts=[e for e in d['battlePlan']['events'] if e['eventId'].startswith('evt-impact-')]
          assert len(impacts)==2
          assert {tuple(e['actors']) for e in impacts}=={('actor_alpha',),('actor_beta',)}
          assert {e['attackTarget'] for e in impacts}=={'actor_alpha:front','actor_beta:front'}
          print('BUGATTI_GENERIC_TWO_SIDED_FIXTURE=PASS')
          PY

      - name: Install Blender runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xz-utils unzip ffmpeg libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 >/dev/null

      - name: Download exact Blender 4.5.13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          ARCHIVE=".blender/blender-${BLENDER_VERSION}.tar.xz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o "$ARCHIVE"
          tar -xJf "$ARCHIVE" -C .blender
          BLENDER_BIN="$GITHUB_WORKSPACE/.blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          test -x "$BLENDER_BIN"
          "$BLENDER_BIN" --version | tee blender-version.log
          grep -q "Blender ${BLENDER_VERSION}" blender-version.log
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Run Candidate 3.8.1 runtime with exact Bugattis
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python blender/run_generic_battle_runtime_v1_candidate381.py \
            -- \
            --request artifacts/generic-battle-runtime-v1-bugatti-preflight/request.json \
            --asset-map artifacts/generic-battle-runtime-v1-bugatti-preflight/asset-map.json \
            --output-dir artifacts/generic-battle-runtime-v1-bugatti-preflight \
            --render-previews \
            2>&1 | tee generic-runtime-bugatti-blender.log
          grep -q 'GENERIC_BATTLE_RUNTIME_CANDIDATE381_ENGINE_HARDENING_PASS' generic-runtime-bugatti-blender.log
          grep -q 'IMPLICIT_PRESENTATION_GEOMETRY_FILTERED' generic-runtime-bugatti-blender.log
          grep -q 'QUALIFIED_NATIVE_RESPONSE_IMPACT' generic-runtime-bugatti-blender.log
          grep -q 'IMPACT_CONSEQUENCE_APPLIED' generic-runtime-bugatti-blender.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_RESULT"' generic-runtime-bugatti-blender.log
          grep -q '"success": true' generic-runtime-bugatti-blender.log
          python3 - <<'PY'
          import json
          rows=[]
          for line in open('generic-runtime-bugatti-blender.log',encoding='utf-8',errors='ignore'):
              line=line.strip()
              if not line.startswith('{'): continue
              try: d=json.loads(line)
              except Exception: continue
              if d.get('marker')=='ACTOR_CANONICAL_FRAME_PASS': rows.append(d)
          assert len(rows)>=1, rows
          for row in rows:
              dims=row['dimensions']
              assert 4.5 <= float(dims[0]) <= 5.3, row
              assert 1.8 <= float(dims[1]) <= 2.6, row
              assert row['canonicalForwardAxis']=='X', row
          print('CANDIDATE381_REAL_BUGATTI_CANONICAL_GEOMETRY=PASS')
          PY
          echo 'CANDIDATE381_EXACT_BUGATTI_EXECUTION=PASS'

      - name: Validate inherited machine truth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_generic_battle_runtime_v1_candidate381_result.py \
            --evidence artifacts/generic-battle-runtime-v1-bugatti-preflight/generic-battle-runtime-v1-evidence.json \
            | tee generic-runtime-bugatti-validation.log
          grep -q '"marker": "GENERIC_BATTLE_RUNTIME_CANDIDATE381_MACHINE_PREFLIGHT"' generic-runtime-bugatti-validation.log
          grep -q '"status": "PASS"' generic-runtime-bugatti-validation.log
          echo 'CANDIDATE381_INHERITED_MACHINE_TRUTH=PASS'

      - name: Build real Bugatti review strip
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          D=artifacts/generic-battle-runtime-v1-bugatti-preflight
          A="$(find "$D" -maxdepth 1 -type f -name 'preview-approach-*.png' -print -quit)"
          I="$(find "$D" -maxdepth 1 -type f -name 'preview-impact-*.png' -print -quit)"
          F="$(find "$D" -maxdepth 1 -type f -name 'preview-aftermath-*.png' -print -quit)"
          test -n "$A" && test -n "$I" && test -n "$F"
          ffmpeg -y -i "$A" -i "$I" -i "$F" -filter_complex 'hstack=inputs=3' -frames:v 1 "$D/review-strip.jpg"
          sha256sum "$D/review-strip.jpg" | tee "$D/review-strip.sha256"
          echo 'CANDIDATE381_REAL_BUGATTI_REVIEW_STRIP=PASS'

      - name: Upload Candidate 3.8.1 exact Bugatti evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iss-generic-battle-runtime-v1-candidate381-bugatti-${{ github.run_id }}
          path: |
            generic-runtime-static.log
            bugatti-asset-preflight.log
            generic-runtime-bugatti-fixture.log
            generic-runtime-bugatti-blender.log
            generic-runtime-bugatti-validation.log
            blender-version.log
            artifacts/visual-vnext-rc2-preflight/
            artifacts/generic-battle-runtime-v1-bugatti-preflight/
          if-no-files-found: warn
          retention-days: 7
