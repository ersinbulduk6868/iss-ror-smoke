name: ISS Generic Autonomous Battle Candidate 4.7.6 Heterogeneous ActorProfile Acceptance

on:
  workflow_dispatch:
  push:
    branches: [iss-engineering/generic-battle-c476-heterogeneous-actorprofile-acceptance]
    paths:
      - '.github/workflows/generic-autonomous-battle-c476-run.yml'
      - 'blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py'
      - 'tools/validate_generic_autonomous_battle_c476_result.py'

concurrency:
  group: iss-generic-autonomous-battle-c476-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BLENDER_VERSION: '4.5.13'
  EXPECTED_BUGATTI_SHA: '8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
  BUGATTI_ACCESS_VERSION: '3.3.33-generic-autonomous-battle-c476-access'
  BUGATTI_ACCESS_URL: 'https://hnszvqlgqatsgbuchewt.supabase.co/functions/v1/iss-final-video-transfer-once'
  SUPABASE_ANON_JWT_FROM_VAR: ${{ vars.SUPABASE_ANON_JWT }}
  BULLDOZER_UID: 'b06a715d23a7450babac383b8bb7fb0a'
  EXPECTED_BULLDOZER_SHA: '2c0be359bbc6c99118751e7caa4b71a205961914e78d2e58c5dd7afc0f498468'
  EXPECTED_BULLDOZER_MASS_KG: '27614.189525707065'
  BULLDOZER_RELAY_VERSION: '1.3.4-c476-heterogeneous-asset-access'
  BULLDOZER_RELAY_URL: 'https://hnszvqlgqatsgbuchewt.supabase.co/functions/v1/generation-nvidia-asset-worker'

jobs:
  c476:
    name: Candidate 4.7.6 exact Bugatti vs production Bulldozer acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout C476 heterogeneous acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Full C474 preservation and C476 acceptance preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/iss_battle_runtime_contract.py \
            blender/iss_battle_runtime_autonomy.py \
            blender/iss_battle_runtime_contact_truth.py \
            blender/iss_battle_runtime_progress_contract_v1.py \
            blender/run_generic_battle_runtime_v1_candidate474_generic_battle.py \
            blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py \
            tools/validate_generic_autonomous_battle_c474_result.py \
            tools/validate_generic_autonomous_battle_c476_result.py
          test "$(git hash-object blender/run_generic_battle_runtime_v1_candidate474_generic_battle.py)" = '341dc1718de47c1c8d8e3022f8117012535a0fca'
          test "$(git hash-object blender/iss_battle_runtime_autonomy.py)" = 'd349c51b289266740df7615d37dc645839001641'
          test "$(git hash-object blender/iss_battle_runtime_contact_truth.py)" = '9041178dd7d1a3951912e49ee398e8fa423da730'
          test "$(git hash-object blender/iss_battle_runtime_consequences.py)" = 'ff239d56b823e31046db9ad300932f82262cbb39'
          test "$(git hash-object blender/iss_blender_battle_runtime_v1_hardened.py)" = 'a9694d22697e1de077415f1198d88df5fa07d00a'
          grep -q '^MIN_DAMAGE_SEVERITY = 0.055$' blender/iss_blender_battle_runtime_v1_hardened.py
          grep -q 'runtimeBehaviorChangedFromC474": False' blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py
          grep -q 'perAssetBattleCode": False' blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py
          grep -q 'damageThresholdAwareControl": False' blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py
          echo 'C476_C474_PRESERVATION_PREFLIGHT=PASS'

      - name: Resolve exact Bugatti through scoped control plane
        shell: bash
        run: |
          set -euo pipefail
          ANON="$SUPABASE_ANON_JWT_FROM_VAR"
          if [ -z "$ANON" ]; then
            ANON="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('.github/workflows/generic-battle-runtime-v1-candidate42-g05.yml').read_text(encoding='utf-8')
          m=re.search(r"SUPABASE_ANON_JWT:\s*'([^']+)'", text)
          if not m: raise SystemExit('PROVEN_G05_ANON_BOOTSTRAP_NOT_FOUND')
          print(m.group(1))
          PY
            )"
          fi
          echo "::add-mask::$ANON"
          mkdir -p artifacts/c476-assets artifacts/visual-vnext-rc2-preflight
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iss-visual-vnext-rc2-assets" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "x-github-oidc: $OIDC" \
            -H 'Content-Type: application/json' --data '{"mode":"resolve_bugatti_pair"}' \
            "$BUGATTI_ACCESS_URL" > artifacts/visual-vnext-rc2-preflight/asset-access.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json'))
          assert d.get('success') is True and d.get('status')=='BUGATTI_PAIR_ACCESS_READY', d
          assert d.get('version')==os.environ['BUGATTI_ACCESS_VERSION'], d
          s=d['asset']
          assert s['expectedSha256']==os.environ['EXPECTED_BUGATTI_SHA'], s
          assert int(s['expectedBytes'])==31576440, s
          assert str(s['signedUrl']).startswith('https://')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUGATTI_SOURCE_URL='+s['signedUrl']+'\n')
          print('C476_EXACT_BUGATTI_ACCESS=PASS')
          PY
          BUGATTI_SOURCE_URL="$(python3 -c "import json; print(json.load(open('artifacts/visual-vnext-rc2-preflight/asset-access.json'))['asset']['signedUrl'])")"
          export BUGATTI_SOURCE_URL
          python3 tools/visual_vnext_rc2_bugatti_duel_asset_preflight.py 2>&1 | tee c476-bugatti-asset.log
          grep -q 'BUGATTI_DUEL_EXACT_SHA=PASS' c476-bugatti-asset.log
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('artifacts/visual-vnext-rc2-preflight/assets.json'))
          a=d['assets']['bugattiA']; b=d['assets']['bugattiB']
          assert a['identity']['primarySceneSha256']==b['identity']['primarySceneSha256']=='8cc074c40fe9ced7271cbeddf223cd9a520dee868977ffcbd439cec1c2b62cb4'
          print('BUGATTI_PRIMARY='+a['primaryScene'])
          PY

      - name: Resolve exact production Bulldozer through scoped Sketchfab relay
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=iss-asset-provider-smoke" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $OIDC" \
            -H 'Content-Type: application/json' \
            --data "{\"mode\":\"signed_source_download\",\"uid\":\"$BULLDOZER_UID\"}" \
            "$BULLDOZER_RELAY_URL" > artifacts/c476-assets/bulldozer-source-access.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('artifacts/c476-assets/bulldozer-source-access.json',encoding='utf-8'))
          assert d.get('success') is True and d.get('status')=='SIGNED_SOURCE_READY', d
          assert d.get('version')==os.environ['BULLDOZER_RELAY_VERSION'], d
          s=d['source']
          assert s['uid']==os.environ['BULLDOZER_UID'], s
          assert s['expectedSourceSha256']==os.environ['EXPECTED_BULLDOZER_SHA'], s
          assert s['provider']=='sketchfab', s
          assert s['artifactKind']=='glb', s
          assert str(s['signedUrl']).startswith('https://'), s
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BULLDOZER_SOURCE_URL='+s['signedUrl']+'\n')
          print('C476_EXACT_BULLDOZER_ACCESS=PASS')
          PY

      - name: Download and verify exact production Bulldozer source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$BULLDOZER_SOURCE_URL" -o artifacts/c476-assets/production-bulldozer.glb
          ACTUAL_SHA="$(sha256sum artifacts/c476-assets/production-bulldozer.glb | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -c '%s' artifacts/c476-assets/production-bulldozer.glb)"
          echo "bulldozerSha=$ACTUAL_SHA bytes=$ACTUAL_BYTES"
          test "$ACTUAL_SHA" = "$EXPECTED_BULLDOZER_SHA"
          test "$ACTUAL_BYTES" -gt 1000000
          echo "BULLDOZER_PRIMARY=$GITHUB_WORKSPACE/artifacts/c476-assets/production-bulldozer.glb" >> "$GITHUB_ENV"
          echo 'C476_EXACT_BULLDOZER_SHA=PASS'

      - name: Build unchanged battle plan and heterogeneous asset binding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_generic_battle_runtime_v1_candidate446_g07.py --bugatti-primary "$BUGATTI_PRIMARY" | tee c476-fixtures.log
          grep -q 'GENERIC_BATTLE_RUNTIME_CANDIDATE446_G07_FIXTURES_PASS' c476-fixtures.log
          SRC=artifacts/generic-battle-runtime-v1-candidate446-g07/exact-bugatti
          DST=artifacts/generic-autonomous-battle-c476/bugatti-bulldozer
          BASE=artifacts/generic-autonomous-battle-c476/base-exact-bugatti
          mkdir -p "$DST" "$BASE"
          cp "$SRC/request.json" "$BASE/request.json"
          cp "$SRC/asset-map.json" "$BASE/asset-map.json"
          python3 - <<'PY'
          import copy, hashlib, json, os
          from pathlib import Path
          src=Path('artifacts/generic-autonomous-battle-c476/base-exact-bugatti/request.json')
          dst=Path('artifacts/generic-autonomous-battle-c476/bugatti-bulldozer/request.json')
          req=json.loads(src.read_text(encoding='utf-8'))
          before=copy.deepcopy(req)
          bindings=req['assetBindings']
          beta=next(b for b in bindings if b['entityId']=='actor_beta')
          beta.update({
            'assetId':'bulldozer-beta',
            'sourceProvider':'sketchfab_exact_source',
            'sourceUid':os.environ['BULLDOZER_UID'],
            'sourceSha256':os.environ['EXPECTED_BULLDOZER_SHA'],
            'totalMassKg':float(os.environ['EXPECTED_BULLDOZER_MASS_KG']),
          })
          def canon(v): return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert canon(req['battlePlan'])==canon(before['battlePlan'])
          assert canon(req['executionPolicy'])==canon(before['executionPolicy'])
          assert canon(req['scenes'])==canon(before['scenes'])
          assert beta['runtimeProfile']==next(b for b in before['assetBindings'] if b['entityId']=='actor_beta')['runtimeProfile']
          assert beta['semanticBodies']==next(b for b in before['assetBindings'] if b['entityId']=='actor_beta')['semanticBodies']
          forbidden=('collisionframe','contactframe','impactframe','targetenergyj','impactenergyj','targetimpactspeedmps','trajectorypoints','pathpoints','waypoints','positionkeyframes','velocitykeyframes','steeringangle','brakingpoint','approachvector','collisionpoint','contactpoint','forcedwinner','winnerid')
          raw=json.dumps(req['battlePlan'],sort_keys=True).lower()
          for token in forbidden: assert token not in raw, token
          dst.write_text(json.dumps(req,indent=2,sort_keys=True),encoding='utf-8')
          evidence={
            'battlePlanSha256':canon(req['battlePlan']),
            'battlePlanUnchanged':True,
            'executionPolicyUnchanged':True,
            'scenesUnchanged':True,
            'onlyActorBetaAssetBindingChanged':True,
            'runtimeProfileUnchanged':True,
            'semanticBodiesUnchanged':True,
            'perAssetTacticalTuning':False,
          }
          Path('artifacts/generic-autonomous-battle-c476/c476-fixture-delta.json').write_text(json.dumps(evidence,indent=2,sort_keys=True),encoding='utf-8')
          PY
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base=json.loads(Path('artifacts/generic-autonomous-battle-c476/base-exact-bugatti/asset-map.json').read_text(encoding='utf-8'))
          base['actor_beta']={
            'path':os.environ['BULLDOZER_PRIMARY'],
            'sha256':os.environ['EXPECTED_BULLDOZER_SHA'],
          }
          Path('artifacts/generic-autonomous-battle-c476/bugatti-bulldozer/asset-map.json').write_text(json.dumps(base,indent=2,sort_keys=True),encoding='utf-8')
          PY
          echo 'C476_HETEROGENEOUS_FIXTURE_FIREWALL=PASS'

      - name: Verify materially dissimilar ActorProfiles before Blender
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from blender.iss_battle_runtime_contract import ActorProfile
          p='artifacts/generic-autonomous-battle-c476/bugatti-bulldozer/request.json'
          d=json.load(open(p,encoding='utf-8'))
          b={x['entityId']:x for x in d['assetBindings']}
          a=ActorProfile.from_binding(b['actor_alpha']); z=ActorProfile.from_binding(b['actor_beta'])
          assert z.mass_kg/a.mass_kg >= 10.0
          assert a.max_speed_mps > z.max_speed_mps
          assert a.acceleration_mps2 > z.acceleration_mps2
          assert a.max_yaw_rate_rad_s > z.max_yaw_rate_rad_s
          assert z.toughness_j_per_kg > a.toughness_j_per_kg
          print(json.dumps({'marker':'C476_HETEROGENEOUS_PROFILE_PREFLIGHT','status':'PASS','bugatti':{'massKg':a.mass_kg,'maxSpeedMps':a.max_speed_mps,'maxYawRateRadS':a.max_yaw_rate_rad_s},'bulldozer':{'massKg':z.mass_kg,'maxSpeedMps':z.max_speed_mps,'maxYawRateRadS':z.max_yaw_rate_rad_s}},sort_keys=True))
          PY

      - name: Install exact Blender 4.5.13
        id: install_blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xz-utils unzip libgl1 libegl1 libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 >/dev/null
          mkdir -p .blender
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o .blender/blender.tar.xz
          tar -xJf .blender/blender.tar.xz -C .blender
          BLENDER_BIN="$GITHUB_WORKSPACE/.blender/blender-${BLENDER_VERSION}-linux-x64/blender"
          "$BLENDER_BIN" --version | tee c476-blender-version.log
          grep -q "Blender ${BLENDER_VERSION}" c476-blender-version.log
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Run exact heterogeneous Bugatti-Bulldozer C476 battle
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          D=artifacts/generic-autonomous-battle-c476/bugatti-bulldozer
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py -- --request "$D/request.json" --asset-map "$D/asset-map.json" --output-dir "$D" 2>&1 | tee c476-hetero-runtime.log
          grep -q 'GENERIC_AUTONOMOUS_BATTLE_C476_ENGINEERING_READY' c476-hetero-runtime.log
          grep -q 'PAIRWISE_NATIVE_SOLVER_CONTACT_VERIFIED' c476-hetero-runtime.log
          grep -q 'G04_AUTONOMY_PROGRESS_REBASED_FOR_TACTICAL_GOAL' c476-hetero-runtime.log
          grep -q 'G04_COLLISION_PROXY_PROGRESS_REFRESHED' c476-hetero-runtime.log
          grep -q 'G07_CAUSAL_CLIMAX_STATE_REALIZED' c476-hetero-runtime.log
          grep -q 'G08_CINEMATIC_SALIENCE_EVIDENCE_WRITTEN' c476-hetero-runtime.log
          grep -q '"success": true' c476-hetero-runtime.log

      - name: Strict C476 heterogeneous machine acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT=artifacts/generic-autonomous-battle-c476
          D="$ROOT/bugatti-bulldozer"
          python3 tools/validate_generic_autonomous_battle_c476_result.py \
            --base-request "$ROOT/base-exact-bugatti/request.json" \
            --hetero-request "$D/request.json" \
            --hetero-battle "$D/generic-autonomous-battle-v6-evidence.json" \
            --hetero-g06 "$D/g06-persistence-evidence.json" \
            --hetero-g07 "$D/g07-causal-drama-evidence.json" \
            --hetero-g08 "$D/g08-camera-evidence.json" \
            --hetero-log c476-hetero-runtime.log | tee c476-machine.log
          grep -q '"marker": "GENERIC_AUTONOMOUS_BATTLE_C476_MACHINE_ACCEPTANCE"' c476-machine.log
          grep -q '"status": "PASS"' c476-machine.log
          grep -q '"heterogeneousActorProfileProof": "PASS"' c476-machine.log
          grep -q '"sameRuntimeAcrossDissimilarActorProfiles": true' c476-machine.log
          grep -q '"lightToHeavyNativeContact": "PASS"' c476-machine.log
          grep -q '"heavyToLightNativeContact": "PASS"' c476-machine.log
          grep -q '"battlePlanUnchanged": true' c476-machine.log
          grep -q '"contactThresholdChanged": false' c476-machine.log
          grep -q '"damageAdmissionThresholdChanged": false' c476-machine.log
          grep -q '"damageThresholdAwareControl": false' c476-machine.log
          grep -q '"desiredImpactSpeedControl": false' c476-machine.log
          grep -q '"humanCinematicAcceptance": "PENDING"' c476-machine.log
          echo 'ISS_GENERIC_AUTONOMOUS_BATTLE_C476_MACHINE_ACCEPTANCE=PASS_HUMAN_REVIEW_PENDING'

      - name: Write C476 manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, os, subprocess
          root=pathlib.Path('artifacts/generic-autonomous-battle-c476'); root.mkdir(parents=True,exist_ok=True)
          def h(p): return subprocess.check_output(['git','hash-object',p],text=True).strip()
          out={
            'candidate':'ISS_GENERIC_BATTLE_RUNTIME_V1_CANDIDATE_4_7_6_HETEROGENEOUS_ACTORPROFILE_ACCEPTANCE',
            'mechanism':'G04_HETEROGENEOUS_ACTORPROFILE_ACCEPTANCE_V1',
            'c474RuntimeReusedUnchanged':True,
            'c474RuntimeSha':h('blender/run_generic_battle_runtime_v1_candidate474_generic_battle.py'),
            'c476WrapperSha':h('blender/run_generic_battle_runtime_v1_candidate476_generic_battle.py'),
            'c476ValidatorSha':h('tools/validate_generic_autonomous_battle_c476_result.py'),
            'bugattiSourceSha256':os.environ['EXPECTED_BUGATTI_SHA'],
            'bulldozerSourceSha256':os.environ['EXPECTED_BULLDOZER_SHA'],
            'bulldozerMassKg':float(os.environ['EXPECTED_BULLDOZER_MASS_KG']),
            'fixtureBattlePlanChanged':False,
            'perAssetBattleCode':False,
            'contactThresholdChanged':False,
            'damageAdmissionThresholdChanged':False,
            'humanCinematicAcceptance':'PENDING_FRESH_REVIEW',
            'gateClosed':False,
            'productionReadyClaimed':False,
            'headSha':os.environ.get('GITHUB_SHA'),
          }
          (root/'c476-acceptance-manifest.json').write_text(json.dumps(out,indent=2,sort_keys=True),encoding='utf-8')
          PY

      - name: Upload C476 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iss-generic-autonomous-battle-c476-${{ github.run_id }}
          path: |
            c476-*.log
            artifacts/generic-autonomous-battle-c476
            artifacts/c476-assets/bulldozer-source-access.json
            artifacts/visual-vnext-rc2-preflight/asset-access.json
          if-no-files-found: warn
          retention-days: 30
