name: ISS G08 Candidate 4.5.0 bootstrap dispatch

on:
  push:
    branches: [iss-engineering/generic-battle-runtime-v1]
    paths:
      - '.github/workflows/generic-battle-runtime-v1-candidate450-g08-bootstrap.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch zero-cost G08 acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generic-battle-runtime-v1-candidate450-g08.yml/dispatches \
            -d '{"ref":"iss-engineering/generic-battle-runtime-v1"}'
          echo 'G08_ACCEPTANCE_DISPATCHED=PASS'
